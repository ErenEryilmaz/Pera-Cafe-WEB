<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pera Kafe — Yönetici Paneli</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg:#0F1117;--surface:#1A1D27;--surface2:#222533;--surface3:#2A2E40;
  --border:#2E3347;--text:#E8EAF0;--text2:#9BA3C0;--text3:#5D6480;
  --accent:#6C63FF;--accent2:#8B85FF;--green:#2ECC71;--red:#E74C3C;
  --orange:#F39C12;--blue:#3498DB;--yellow:#F1C40F;
  --shadow:0 4px 20px rgba(0,0,0,.4);
  --r:10px;--r-sm:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:340px;box-shadow:var(--shadow)}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-card p{color:var(--text2);font-size:13px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent)}
.btn{padding:10px 20px;border:none;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff;width:100%;padding:12px}
.btn-primary:hover{background:var(--accent2)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-green{background:rgba(46,204,113,.15);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.btn-green:hover{background:rgba(46,204,113,.25)}
.btn-red{background:rgba(231,76,60,.15);color:var(--red);border:1px solid rgba(231,76,60,.3)}
.btn-red:hover{background:rgba(231,76,60,.25)}
.btn-blue{background:rgba(52,152,219,.15);color:var(--blue);border:1px solid rgba(52,152,219,.3)}
.btn-blue:hover{background:rgba(52,152,219,.25)}
.btn-orange{background:rgba(243,156,18,.15);color:var(--orange);border:1px solid rgba(243,156,18,.3)}
.btn-orange:hover{background:rgba(243,156,18,.25)}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none}
.login-err.show{display:block}

/* ── SIDEBAR ── */
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-logo span{font-weight:700;font-size:15px}
.sidebar-logo small{color:var(--text2);font-size:11px;display:block}
nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;color:var(--text2);transition:all .2s;margin-bottom:2px;font-size:13px;font-weight:500}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(108,99,255,.15);color:var(--accent)}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-sep{height:1px;background:var(--border);margin:10px 8px}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border)}
.user-badge{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2)}
.user-badge .av{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.user-badge .info{flex:1;min-width:0}
.user-badge .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-badge .role{font-size:10px;color:var(--text2)}
.logout-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;transition:color .2s}
.logout-btn:hover{color:var(--red)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar h2{font-size:16px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-pending{background:rgba(243,156,18,.15);color:var(--orange)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── CONTENT ── */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat-card .label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .sub{font-size:12px;color:var(--text2);margin-top:4px}
.stat-card.green .value{color:var(--green)}
.stat-card.orange .value{color:var(--orange)}
.stat-card.blue .value{color:var(--blue)}
.stat-card.purple .value{color:var(--accent)}

/* ── TABLE ── */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px}
.section-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-header h3{font-size:14px;font-weight:700}
.section-header .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
thead{background:var(--surface2)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}

/* Status pills */
.status{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.status-pending  {background:rgba(243,156,18,.15);color:var(--orange)}
.status-preparing{background:rgba(52,152,219,.15);color:var(--blue)}
.status-ready    {background:rgba(46,204,113,.15);color:var(--green)}
.status-completed{background:rgba(93,100,128,.15);color:var(--text3)}
.status-cancelled{background:rgba(231,76,60,.15);color:var(--red)}

/* Stock indicators */
.stock-ok  {color:var(--green);font-weight:700}
.stock-low {color:var(--orange);font-weight:700}
.stock-out {color:var(--red);font-weight:700}
.stock-inf {color:var(--text3)}

/* ── FORM ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:20px}
.modal .form-group{margin-bottom:14px}
.modal select{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13px;outline:none}
.modal input[type=checkbox]{width:auto;cursor:pointer}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* ── CHART ── */
.chart-wrap{padding:16px 20px 20px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);opacity:.7;min-height:4px;transition:height .3s}
.bar-label{font-size:9px;color:var(--text3)}
.bar-val{font-size:9px;color:var(--text2)}

/* ── SEARCH ── */
.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 12px;color:var(--text);font-size:13px;outline:none;width:180px}
.search-input:focus{border-color:var(--accent)}
select.filter{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;color:var(--text);font-size:12px;outline:none}

/* ── EDITABLE ── */
.editable{cursor:pointer;border-bottom:1px dashed var(--border);padding:1px 4px;border-radius:2px;transition:background .15s}
.editable:hover{background:var(--surface2)}
.inline-input{width:80px;background:var(--surface2);border:1px solid var(--accent);border-radius:4px;padding:3px 6px;color:var(--text);font-size:13px;outline:none}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 18px;font-size:13px;font-weight:500;box-shadow:var(--shadow);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;max-width:280px}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* ── INLINE EDIT ── */
.edit-price-form{display:flex;align-items:center;gap:4px}
.stock-bar{height:4px;border-radius:2px;background:var(--surface3);margin-top:3px;overflow:hidden}
.stock-bar-fill{height:100%;border-radius:2px;transition:width .3s}

/* scrollbar */
::-webkit-scrollbar{width:5px}

/* ── CAMPAIGN COLORS ── */
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
.color-dot.active{border-color:#fff;transform:scale(1.15)}
.color-dot:hover{transform:scale(1.1)}
/* ── CAMPAIGN CARD (admin) ── */
.camp-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:background .2s}
.camp-card:hover{background:var(--surface3)}
.camp-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap;letter-spacing:.3px}
.camp-info{flex:1;min-width:0}
.camp-title{font-size:14px;font-weight:700;margin-bottom:3px}
.camp-desc{font-size:12px;color:var(--text2);margin-bottom:4px}
.camp-meta{font-size:11px;color:var(--text3)}
.camp-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.toggle-switch{position:relative;width:38px;height:20px;cursor:pointer;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked + .toggle-slider{background:var(--green)}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(18px)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── LOADING ── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGİN EKRANI -->
<div id="login-screen">
  <div class="login-card">
    <h1>☕ Pera Kafe</h1>
    <p>Yönetici paneline giriş yapın</p>
    <div class="form-group">
      <label>Kullanıcı Adı</label>
      <input type="text" id="login-user" value="admin" onkeypress="if(event.key==='Enter')doLogin()">
    </div>
    <div class="form-group">
      <label>Şifre</label>
      <input type="password" id="login-pass" value="" onkeypress="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="login-err">Kullanıcı adı veya şifre hatalı.</div>
  </div>
</div>

<!-- ANA PANEL -->
<div id="sidebar">
  <div class="sidebar-logo">
    <div class="icon">☕</div>
    <div><span>Pera Kafe</span><small>Admin Panel</small></div>
  </div>
  <nav>
    <div class="nav-item active" onclick="showPage('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="nav-item" onclick="showPage('orders')"><i class="fas fa-receipt"></i> Siparişler <span id="pending-badge" style="margin-left:auto;display:none" class="badge badge-pending">0</span></div>
    <div class="nav-sep"></div>
    <div class="nav-item" onclick="showPage('products')"><i class="fas fa-coffee"></i> Ürünler</div>
    <div class="nav-item" onclick="showPage('stock')"><i class="fas fa-boxes"></i> Stok</div>
    <div class="nav-item" onclick="showPage('categories')"><i class="fas fa-tags"></i> Kategoriler</div>
    <div class="nav-sep"></div>
    <div class="nav-item" onclick="showPage('members')"><i class="fas fa-users"></i> Üyeler</div>
    <div class="nav-sep"></div>
    <div class="nav-item" onclick="showPage('reports')"><i class="fas fa-chart-bar"></i> Raporlar</div>
    <div class="nav-item" onclick="showPage('campaigns')"><i class="fas fa-tags"></i> Kampanyalar</div>
  </nav>
  <div class="sidebar-bottom">
    <div class="user-badge">
      <div class="av">A</div>
      <div class="info">
        <div class="name" id="admin-name-badge">Admin</div>
        <div class="role">Yönetici</div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Çıkış"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </div>
</div>

<div id="main">
  <div class="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="topbar-right">
      <div class="live-dot" title="Canlı"></div>
      <span style="font-size:12px;color:var(--text2)" id="last-refresh">—</span>
    </div>
  </div>
  <div id="content"><!-- sayfalar buraya yüklenir --></div>
</div>

<!-- ÜRÜN EKLE MODAL -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h3 id="product-modal-title">Yeni Ürün Ekle</h3>
    <div class="form-group">
      <label>Ürün Adı</label>
      <input type="text" id="pm-name" placeholder="Ör: Sütlü Latte">
    </div>
    <div class="form-group">
      <label>Kategori</label>
      <select id="pm-cat"></select>
    </div>
    <div class="form-group">
      <label>Fiyat (₺)</label>
      <input type="number" id="pm-price" min="0" step="0.5" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Başlangıç Stok</label>
      <input type="number" id="pm-stock" min="-1" value="50">
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="pm-cold">
      <label for="pm-cold" style="text-transform:none;letter-spacing:0;cursor:pointer">🧊 Soğuk içecek</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal('product-modal')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text)">İptal</button>
      <button class="btn btn-sm btn-primary" onclick="saveProduct()">Kaydet</button>
    </div>
  </div>
</div>

<!-- KATEGORİ EKLE MODAL -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h3>Yeni Kategori Ekle</h3>
    <div class="form-group">
      <label>Kategori Adı</label>
      <input type="text" id="cat-name" placeholder="Ör: Soğuk İçecekler">
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal('cat-modal')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text)">İptal</button>
      <button class="btn btn-sm btn-primary" onclick="saveCategory()">Kaydet</button>
    </div>
  </div>
</div>

<!-- KAMPANYA EKLE/DÜZENLE MODAL -->
<div class="modal-overlay" id="camp-modal">
  <div class="modal">
    <h3 id="camp-modal-title">Yeni Kampanya</h3>
    <div class="form-group">
      <label>Başlık</label>
      <input type="text" id="camp-title" placeholder="Ör: 2 Alana 1 Bedava">
    </div>
    <div class="form-group">
      <label>Açıklama</label>
      <input type="text" id="camp-desc" placeholder="Kampanya detayı (opsiyonel)">
    </div>
    <div class="form-group">
      <label>Kampanya Tipi</label>
      <select id="camp-type" onchange="updateCampFields()">
        <option value="buy_x_get_y">X Alana Y Bedava</option>
        <option value="percentage">Yüzde İndirim (%)</option>
        <option value="fixed">Sabit İndirim (₺)</option>
      </select>
    </div>
    <!-- X alana Y bedava alanları -->
    <div id="camp-fields-buy" style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Kaç Alınacak</label>
        <input type="number" id="camp-buy" min="1" value="2">
      </div>
      <div class="form-group" style="flex:1">
        <label>Kaç Bedava</label>
        <input type="number" id="camp-get" min="1" value="1">
      </div>
    </div>
    <!-- Yüzde indirim -->
    <div id="camp-fields-pct" style="display:none">
      <div class="form-group">
        <label>İndirim Oranı (%)</label>
        <input type="number" id="camp-pct" min="1" max="100" value="10">
      </div>
    </div>
    <!-- Sabit indirim -->
    <div id="camp-fields-fix" style="display:none">
      <div class="form-group">
        <label>İndirim Tutarı (₺)</label>
        <input type="number" id="camp-fix" min="1" value="20">
      </div>
    </div>
    <!-- Kapsam: hangi ürünlere uygulanacak -->
    <div class="form-group">
      <label>Hangi Ürünlere Uygulanacak?</label>
      <select id="camp-scope" onchange="updateCampScope()">
        <option value="all">Tüm Ürünler</option>
        <option value="category">Kategori Bazlı</option>
        <option value="product">Ürün Bazlı</option>
      </select>
    </div>
    <div class="form-group" id="camp-scope-targets" style="display:none">
      <label id="camp-scope-label">Kategoriler</label>
      <div id="camp-scope-list" style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;background:var(--surface2)"></div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Başlangıç Tarihi</label>
        <input type="date" id="camp-start" style="width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13px;outline:none">
      </div>
      <div class="form-group" style="flex:1">
        <label>Bitiş Tarihi</label>
        <input type="date" id="camp-end" style="width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13px;outline:none">
      </div>
    </div>
    <div class="form-group">
      <label>Rozet Rengi</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="camp-colors">
        <div class="color-dot active" style="background:#27AE60" data-color="#27AE60" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#E67E22" data-color="#E67E22" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#2980B9" data-color="#2980B9" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#8E44AD" data-color="#8E44AD" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#E74C3C" data-color="#E74C3C" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#F39C12" data-color="#F39C12" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#1ABC9C" data-color="#1ABC9C" onclick="selectColor(this)"></div>
        <input type="color" id="camp-color-custom" value="#27AE60" oninput="selectCustomColor(this.value)"
          style="width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:1px;background:none">
      </div>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="camp-active" checked>
      <label for="camp-active" style="text-transform:none;letter-spacing:0;cursor:pointer">Kampanyayı aktif et</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal('camp-modal')" style="background:var(--surface2);border:1px solid var(--border);color:var(--text)">İptal</button>
      <button class="btn btn-sm btn-primary" onclick="saveCampaign()">Kaydet</button>
    </div>
  </div>
</div>


<div id="toast"></div>

<script>
// UI FIX — Hardcoded URL yerine dinamik origin kullanılıyor.
// Eski: const API = 'http://127.0.0.1:8000'  (production'da çalışmıyordu)
const API = window.location.origin;
let token = sessionStorage.getItem('adminToken') || '';
let refreshTimer = null;
let categories   = [];

// ── AUTH ──────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  try {
    const r = await fetch(`${API}/admin/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: user, password: pass})
    });
    if (!r.ok) { document.getElementById('login-err').classList.add('show'); return; }
    const d = await r.json();
    token = d.token;
    sessionStorage.setItem('adminToken', token);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-name-badge').textContent = user.charAt(0).toUpperCase() + user.slice(1);
    initPanel();
  } catch(e) {
    document.getElementById('login-err').classList.add('show');
  }
}

async function doLogout() {
  try { await apiFetch('/admin/logout', {method:'POST'}); } catch(e) {}
  sessionStorage.removeItem('adminToken');
  location.reload();
}

function apiFetch(path, opts={}) {
  return fetch(API+path, {
    ...opts,
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+token, ...(opts.headers||{})},
    body: opts.body ? (typeof opts.body==='string' ? opts.body : JSON.stringify(opts.body)) : undefined,
  }).then(async r => {
    if (r.status === 401) { doLogout(); throw new Error('Oturum sona erdi.'); }
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Hata');
    return d;
  });
}

function initPanel() {
  if (token) document.getElementById('login-screen').style.display = 'none';
  // FIX: token yokken giriş ekranı için #main/#sidebar opaklığı 0.3'e düşürülüyordu
  // ama giriş sonrası geri alınmıyordu — panel "koyu kalıyordu". Burada sıfırlıyoruz.
  document.getElementById('main').style.opacity = '1';
  document.getElementById('sidebar').style.opacity = '1';
  loadCategories();
  showPage('dashboard');
  startAutoRefresh();
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    const cur = document.querySelector('.nav-item.active');
    if (cur) {
      const page = cur.getAttribute('onclick').match(/'(\w+)'/)?.[1];
      if (page === 'orders') loadOrders();
      if (page === 'dashboard') loadDashboard();
    }
  }, 15000); // 15 sn
}

// ── NAVİGASYON ────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard:'Dashboard', orders:'Siparişler', products:'Ürünler',
  stock:'Stok Yönetimi', categories:'Kategoriler', members:'Üyeler', campaigns:'Kampanyalar', reports:'Satış Raporları'
};

function showPage(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navs = document.querySelectorAll('.nav-item');
  navs.forEach(n => { if (n.getAttribute('onclick')?.includes(`'${page}'`)) n.classList.add('active'); });
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;
  const fn = {dashboard:loadDashboard, orders:loadOrders, products:loadProducts, stock:loadStock, categories:loadCategories, members:loadMembers, campaigns:loadCampaigns, reports:loadReports};
  if (fn[page]) fn[page]();
}

function setRefreshTime() {
  document.getElementById('last-refresh').textContent = 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
}

// ── DASHBOARD ─────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const d = await apiFetch('/admin/dashboard');
    setRefreshTime();
    const maxRev = Math.max(...d.weekly_revenue.map(r=>r.rev), 1);
    document.getElementById('content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card green">
          <div class="label">Bugünkü Sipariş</div>
          <div class="value">${d.today_orders}</div>
          <div class="sub">Toplam sipariş adedi</div>
        </div>
        <div class="stat-card blue">
          <div class="label">Bugünkü Ciro</div>
          <div class="value">${d.today_revenue.toLocaleString('tr-TR')} ₺</div>
          <div class="sub">Tamamlanan + aktif</div>
        </div>
        <div class="stat-card orange">
          <div class="label">Bekleyen Siparişler</div>
          <div class="value" style="cursor:pointer" onclick="showPage('orders')">${d.pending_orders}</div>
          <div class="sub">Hazırlanmayı bekliyor</div>
        </div>
        <div class="stat-card ${d.low_stock_count>0?'orange':'purple'}">
          <div class="label">Düşük Stok Uyarısı</div>
          <div class="value" style="cursor:pointer" onclick="showPage('stock')">${d.low_stock_count}</div>
          <div class="sub">10'un altındaki ürünler</div>
        </div>
        <div class="stat-card purple">
          <div class="label">Toplam Üye</div>
          <div class="value">${d.total_members}</div>
          <div class="sub">Kayıtlı müşteriler</div>
        </div>
      </div>

      <div class="section">
        <div class="section-header"><h3>📊 Son 7 Gün — Günlük Ciro</h3></div>
        <div class="chart-wrap">
          <div class="bar-chart" id="bar-chart"></div>
        </div>
      </div>

      <div class="section" id="pending-section">
        <div class="section-header"><h3>🔔 Bekleyen Siparişler</h3><button class="btn btn-sm btn-blue" onclick="showPage('orders')">Tümünü Gör</button></div>
        <div id="pending-orders-list"><div style="padding:20px;color:var(--text2);text-align:center">Yükleniyor...</div></div>
      </div>`;

    // Bar chart
    const bc = document.getElementById('bar-chart');
    const days = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    d.weekly_revenue.forEach(r => {
      const h = Math.max(8, Math.round((r.rev/maxRev)*90));
      const dayName = new Date(r.day).toLocaleDateString('tr-TR',{weekday:'short'});
      bc.innerHTML += `<div class="bar-col">
        <div class="bar-val">${r.rev>0?r.rev.toLocaleString('tr-TR',{maximumFractionDigits:0})+'₺':''}</div>
        <div class="bar" style="height:${h}px" title="${r.day}: ${r.rev}₺"></div>
        <div class="bar-label">${dayName}</div></div>`;
    });

    // Bekleyen siparişler
    const orders = await apiFetch('/admin/orders?status=pending&limit=5');
    const pl = document.getElementById('pending-orders-list');
    if (!orders.length) { pl.innerHTML = '<div style="padding:16px 20px;color:var(--text2)">Bekleyen sipariş yok ✓</div>'; return; }
    pl.innerHTML = `<table><thead><tr><th>#</th><th>Masa</th><th>Toplam</th><th>Saat</th><th>İşlem</th></tr></thead><tbody>
      ${orders.map(o=>`<tr>
        <td>#${o.OrderID}</td>
        <td>${o.TableNo}</td>
        <td><strong>${parseFloat(o.TotalAmount).toFixed(2)} ₺</strong></td>
        <td>${new Date(o.CreatedAt).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</td>
        <td><button class="btn btn-sm btn-blue" onclick="setStatus(${o.OrderID},'preparing')">Hazırlıyor</button></td>
      </tr>`).join('')}
    </tbody></table>`;
  } catch(e) { showToast(e.message,'err'); }
}

// ── SİPARİŞLER ────────────────────────────────────────────────
let orderFilter = 'all';

async function loadOrders() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>📋 Siparişler</h3>
        <div class="actions">
          <select class="filter" onchange="orderFilter=this.value;loadOrders()" id="order-filter">
            <option value="all">Tümü</option>
            <option value="pending">Bekliyor</option>
            <option value="preparing">Hazırlanıyor</option>
            <option value="ready">Hazır</option>
            <option value="completed">Tamamlandı</option>
            <option value="cancelled">İptal</option>
          </select>
          <button class="btn btn-sm btn-blue" onclick="loadOrders()"><i class="fas fa-sync"></i> Yenile</button>
          <button class="btn btn-sm btn-green" onclick="exportOrders()" title="CSV olarak indir"><i class="fas fa-file-csv"></i> CSV İndir</button>
        </div>
      </div>
      <div id="orders-body"><div style="padding:20px;color:var(--text2);text-align:center"><span class="spinner"></span>Yükleniyor...</div></div>
    </div>`;

  document.getElementById('order-filter').value = orderFilter;
  try {
    const orders = await apiFetch(`/admin/orders?status=${orderFilter}&limit=100`);
    updatePendingBadge(orders.filter(o=>o.Status==='pending').length);
    const tbody = document.getElementById('orders-body');
    if (!orders.length) { tbody.innerHTML='<div style="padding:20px;color:var(--text2);text-align:center">Sipariş bulunamadı.</div>'; return; }
    tbody.innerHTML = `<table>
      <thead><tr><th>#</th><th>Masa</th><th>Ürünler</th><th>Toplam</th><th>Durum</th><th>Saat</th><th>İşlemler</th></tr></thead>
      <tbody>${orders.map(o=>{
        const items = o.items?.map(i=>`${i.Quantity}x ${i.ProductName}`).join(', ') || '—';
        const t = new Date(o.CreatedAt).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        return `<tr>
          <td><strong>#${o.OrderID}</strong></td>
          <td>${o.TableNo}${o.MemberPhone?`<br><small style="color:var(--text2)">${o.MemberPhone}</small>`:''}</td>
          <td style="max-width:200px;white-space:normal;font-size:12px;color:var(--text2)">${items}</td>
          <td><strong>${parseFloat(o.TotalAmount).toFixed(2)} ₺</strong></td>
          <td>${statusBadge(o.Status)}</td>
          <td style="font-size:12px;color:var(--text2)">${t}</td>
          <td>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              ${o.Status==='pending'    ? `<button class="btn btn-sm btn-blue" onclick="setStatus(${o.OrderID},'preparing')">Hazırlıyor</button>`:''}
              ${o.Status==='preparing' ? `<button class="btn btn-sm btn-green" onclick="setStatus(${o.OrderID},'ready')">Hazır</button>`:''}
              ${o.Status==='ready'     ? `<button class="btn btn-sm btn-green" onclick="setStatus(${o.OrderID},'completed')">Teslim Et</button>`:''}
              ${['pending','preparing'].includes(o.Status) ? `<button class="btn btn-sm btn-red" onclick="setStatus(${o.OrderID},'cancelled')">İptal</button>`:''}
              <button class="btn btn-sm btn-red" onclick="deleteOrder(${o.OrderID})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      }).join('')}</tbody></table>`;
  } catch(e) { showToast(e.message,'err'); }
}

function statusBadge(s) {
  const labels = {pending:'Bekliyor',preparing:'Hazırlanıyor',ready:'Hazır',completed:'Tamamlandı',cancelled:'İptal'};
  return `<span class="status status-${s}">${labels[s]||s}</span>`;
}

async function setStatus(id, status) {
  try { await apiFetch(`/admin/orders/${id}/status`, {method:'PATCH', body:{status}}); showToast('Durum güncellendi ✓'); loadOrders(); }
  catch(e) { showToast(e.message,'err'); }
}

async function deleteOrder(id) {
  if (!confirm(`#${id} nolu siparişi silmek istediğinize emin misiniz?`)) return;
  try { await apiFetch(`/admin/orders/${id}`, {method:'DELETE'}); showToast('Sipariş silindi ✓'); loadOrders(); }
  catch(e) { showToast(e.message,'err'); }
}

function updatePendingBadge(count) {
  const b = document.getElementById('pending-badge');
  if (count > 0) { b.textContent=count; b.style.display='inline-block'; }
  else { b.style.display='none'; }
}

// ── ÜRÜNLER ───────────────────────────────────────────────────
async function loadProducts() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>☕ Ürün Listesi</h3>
        <div class="actions">
          <input class="search-input" id="prod-search" placeholder="🔍 Ürün ara..." oninput="filterProducts()" />
          <button class="btn btn-sm btn-green" onclick="openProductModal()"><i class="fas fa-plus"></i> Yeni Ürün</button>
        </div>
      </div>
      <div id="products-body"><div style="padding:20px;color:var(--text2);text-align:center">Yükleniyor...</div></div>
    </div>`;
  try {
    window._products = await apiFetch('/admin/products');
    renderProducts(window._products);
  } catch(e) { showToast(e.message,'err'); }
}

function filterProducts() {
  const q = document.getElementById('prod-search')?.value.toLowerCase() || '';
  renderProducts((window._products||[]).filter(p => p.ProductName.toLowerCase().includes(q) || p.CategoryName.toLowerCase().includes(q)));
}

function renderProducts(prods) {
  const tbody = document.getElementById('products-body');
  if (!prods.length) { tbody.innerHTML='<div style="padding:20px;color:var(--text2);text-align:center">Ürün bulunamadı.</div>'; return; }
  tbody.innerHTML = `<table>
    <thead><tr><th>Ürün</th><th>Kategori</th><th>Fiyat</th><th>Stok</th><th>Tür</th><th>Durum</th><th>İşlemler</th></tr></thead>
    <tbody>${prods.map(p=>{
      const sClass = p.StockQuantity===-1?'stock-inf':p.StockQuantity===0?'stock-out':p.StockQuantity<10?'stock-low':'stock-ok';
      const sText  = p.StockQuantity===-1?'∞':p.StockQuantity;
      const sBar   = p.StockQuantity===-1?100:Math.min(100,Math.round((p.StockQuantity/100)*100));
      const sColor = p.StockQuantity===0?'var(--red)':p.StockQuantity<10?'var(--orange)':'var(--green)';
      return `<tr>
        <td><strong>${p.ProductName}</strong></td>
        <td><span style="font-size:11px;background:var(--surface3);padding:2px 8px;border-radius:20px;color:var(--text2)">${p.CategoryName}</span></td>
        <td>
          <div class="edit-price-form">
            <span class="editable" onclick="editPrice(this,${p.ProductID})">${parseFloat(p.BasePrice).toFixed(2)} ₺</span>
          </div>
        </td>
        <td>
          <span class="${sClass}">${sText}</span>
          <div class="stock-bar"><div class="stock-bar-fill" style="width:${sBar}%;background:${sColor}"></div></div>
        </td>
        <td>${p.IsCold?'🧊 Soğuk':'☕ Sıcak'}</td>
        <td><span class="status ${p.IsActive?'status-ready':'status-cancelled'}">${p.IsActive?'Aktif':'Pasif'}</span></td>
        <td>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-orange" onclick="toggleActive(${p.ProductID},${p.IsActive})" title="${p.IsActive?'Pasife Al':'Aktife Al'}">${p.IsActive?'Pasife Al':'Aktife Al'}</button>
            <button class="btn btn-sm btn-red" onclick="deleteProduct(${p.ProductID})" title="Sil"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function editPrice(el, id) {
  const cur = parseFloat(el.textContent);
  el.outerHTML = `<input class="inline-input" id="ep-${id}" type="number" value="${cur}" step="0.5" min="0"
    onblur="savePrice(${id},this.value)" onkeypress="if(event.key==='Enter')savePrice(${id},this.value)">`;
  document.getElementById(`ep-${id}`)?.focus();
}

async function savePrice(id, val) {
  const price = parseFloat(val);
  if (isNaN(price) || price < 0) { loadProducts(); return; }
  try { await apiFetch(`/admin/products/${id}`, {method:'PATCH', body:{price}}); showToast('Fiyat güncellendi ✓'); loadProducts(); }
  catch(e) { showToast(e.message,'err'); loadProducts(); }
}

async function toggleActive(id, current) {
  try { await apiFetch(`/admin/products/${id}`, {method:'PATCH', body:{is_active: !current}}); showToast('Durum güncellendi ✓'); loadProducts(); }
  catch(e) { showToast(e.message,'err'); }
}

async function deleteProduct(id) {
  if (!confirm('Bu ürünü pasife almak istediğinize emin misiniz? (Sipariş geçmişi korunur)')) return;
  try { await apiFetch(`/admin/products/${id}`, {method:'DELETE'}); showToast('Ürün pasife alındı ✓'); loadProducts(); }
  catch(e) { showToast(e.message,'err'); }
}

function openProductModal() {
  document.getElementById('pm-name').value = '';
  document.getElementById('pm-price').value = '';
  document.getElementById('pm-stock').value = '50';
  document.getElementById('pm-cold').checked = false;
  const sel = document.getElementById('pm-cat');
  sel.innerHTML = categories.map(c=>`<option value="${c.CategoryID}">${c.CategoryName}</option>`).join('');
  openModal('product-modal');
}

async function saveProduct() {
  const name = document.getElementById('pm-name').value.trim();
  const price = parseFloat(document.getElementById('pm-price').value);
  const stock = parseInt(document.getElementById('pm-stock').value);
  const cat   = parseInt(document.getElementById('pm-cat').value);
  const cold  = document.getElementById('pm-cold').checked;
  if (!name || isNaN(price)) { showToast('Ad ve fiyat zorunludur.','err'); return; }
  try {
    await apiFetch('/admin/products', {method:'POST', body:{category_id:cat, name, price, stock, is_cold:cold}});
    closeModal('product-modal'); showToast('Ürün eklendi ✓'); loadProducts();
  } catch(e) { showToast(e.message,'err'); }
}

// ── STOK ──────────────────────────────────────────────────────
async function loadStock() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>📦 Stok Yönetimi</h3>
        <div class="actions">
          <select class="filter" onchange="stockFilter=this.value;renderStock()" id="stock-filter-sel">
            <option value="all">Tümü</option>
            <option value="low">Düşük (≤10)</option>
            <option value="out">Tükenmiş</option>
          </select>
          <button class="btn btn-sm btn-blue" onclick="loadStock()"><i class="fas fa-sync"></i> Yenile</button>
        </div>
      </div>
      <div id="stock-body"><div style="padding:20px;color:var(--text2);text-align:center">Yükleniyor...</div></div>
    </div>`;
  try {
    window._stock = await apiFetch('/admin/stock');
    window.stockFilter = 'all';
    renderStock();
  } catch(e) { showToast(e.message,'err'); }
}

function renderStock() {
  let rows = window._stock || [];
  const f  = window.stockFilter || 'all';
  if (f==='low') rows = rows.filter(r=>r.StockQuantity<=10&&r.StockQuantity!==-1);
  if (f==='out') rows = rows.filter(r=>r.StockQuantity===0);
  const tbody = document.getElementById('stock-body');
  if (!rows.length) { tbody.innerHTML='<div style="padding:20px;color:var(--text2);text-align:center">Kayıt bulunamadı.</div>'; return; }
  tbody.innerHTML = `<table>
    <thead><tr><th>Ürün</th><th>Kategori</th><th>Mevcut Stok</th><th>Durum</th><th>Stok Güncelle</th></tr></thead>
    <tbody>${rows.map(p=>{
      const sClass = p.StockQuantity===-1?'stock-inf':p.StockQuantity===0?'stock-out':p.StockQuantity<10?'stock-low':'stock-ok';
      const sText  = p.StockQuantity===-1?'Sınırsız':p.StockQuantity;
      const sLabel = p.StockQuantity===-1?'Sınırsız':p.StockQuantity===0?'⚠️ Tükendi':p.StockQuantity<10?'⚡ Kritik':'✓ Yeterli';
      return `<tr>
        <td><strong>${p.ProductName}</strong></td>
        <td><span style="font-size:11px;background:var(--surface3);padding:2px 8px;border-radius:20px;color:var(--text2)">${p.CategoryName}</span></td>
        <td><span class="${sClass}" style="font-size:16px">${sText}</span></td>
        <td><span class="status ${p.StockQuantity===0?'status-cancelled':p.StockQuantity<10?'status-pending':'status-ready'}">${sLabel}</span></td>
        <td>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn btn-sm btn-red" onclick="adjustStock(${p.ProductID},-5)">-5</button>
            <button class="btn btn-sm btn-red" onclick="adjustStock(${p.ProductID},-1)">-1</button>
            <button class="btn btn-sm btn-green" onclick="adjustStock(${p.ProductID},1)">+1</button>
            <button class="btn btn-sm btn-green" onclick="adjustStock(${p.ProductID},10)">+10</button>
            <button class="btn btn-sm btn-blue" onclick="setStockDirect(${p.ProductID},${p.StockQuantity})" title="Değer gir">✎</button>
          </div>
        </td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

async function adjustStock(id, delta) {
  const item = (window._stock||[]).find(s=>s.ProductID===id);
  if (!item) return;
  const newVal = Math.max(0, item.StockQuantity + delta);
  await saveStockVal(id, newVal);
}

async function setStockDirect(id, cur) {
  const val = prompt('Yeni stok miktarını girin (-1 = Sınırsız):', cur);
  if (val === null) return;
  await saveStockVal(id, parseInt(val));
}

async function saveStockVal(id, val) {
  try {
    await apiFetch(`/admin/stock/${id}`, {method:'PATCH', body:{stock:val}});
    showToast('Stok güncellendi ✓');
    loadStock();
  } catch(e) { showToast(e.message,'err'); }
}

// ── KATEGORİLER ───────────────────────────────────────────────
async function loadCategories() {
  try {
    categories = await apiFetch('/admin/categories');
  } catch(e) {}
  if (document.getElementById('page-title')?.textContent === 'Kategoriler') {
    renderCategories();
  }
}

function renderCategories() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>🏷️ Kategoriler</h3>
        <button class="btn btn-sm btn-green" onclick="openModal('cat-modal')"><i class="fas fa-plus"></i> Kategori Ekle</button>
      </div>
      <table>
        <thead><tr><th>#</th><th>Kategori Adı</th></tr></thead>
        <tbody>${categories.map(c=>`<tr><td>${c.CategoryID}</td><td><strong>${c.CategoryName}</strong></td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

async function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { showToast('Kategori adı zorunludur.','err'); return; }
  try {
    await apiFetch('/admin/categories', {method:'POST', body:{name}});
    closeModal('cat-modal');
    await loadCategories();
    showToast('Kategori eklendi ✓');
    renderCategories();
  } catch(e) { showToast(e.message,'err'); }
}

// ── ÜYELER ────────────────────────────────────────────────────
async function loadMembers() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="section">
      <div class="section-header">
        <h3>👥 Üyeler</h3>
        <input class="search-input" id="member-search" placeholder="🔍 Telefon veya ad ara..." oninput="filterMembers()">
      </div>
      <div id="members-body"><div style="padding:20px;color:var(--text2);text-align:center">Yükleniyor...</div></div>
    </div>`;
  try {
    window._members = await apiFetch('/admin/members');
    renderMembers(window._members);
  } catch(e) { showToast(e.message,'err'); }
}

function filterMembers() {
  const q = document.getElementById('member-search')?.value.toLowerCase() || '';
  renderMembers((window._members||[]).filter(m=>
    (m.phone||'').includes(q) || ((m.first_name||'')+' '+(m.last_name||'')).toLowerCase().includes(q)
  ));
}

function renderMembers(members) {
  const tbody = document.getElementById('members-body');
  if (!members.length) { tbody.innerHTML='<div style="padding:20px;color:var(--text2);text-align:center">Üye bulunamadı.</div>'; return; }
  tbody.innerHTML = `<table>
    <thead><tr><th>Ad Soyad</th><th>Telefon</th><th>Sipariş Sayısı</th><th>Toplam Harcama</th><th>Kayıt Tarihi</th></tr></thead>
    <tbody>${members.map(m=>{
      // FIX: alanlar null/eksik gelirse satır render'ı çökmesin diye güvenli erişim
      const name    = `${m.first_name||''} ${m.last_name||''}`.trim() || '—';
      const spent   = (Number(m.total_spent)||0).toFixed(2);
      const created = m.created_at ? new Date(m.created_at).toLocaleDateString('tr-TR') : '—';
      return `<tr>
        <td><strong>${name}</strong></td>
        <td style="font-family:monospace">${m.phone||'—'}</td>
        <td>${m.order_count||0}</td>
        <td>${spent} ₺</td>
        <td style="font-size:12px;color:var(--text2)">${created}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// ── YARDIMCI ──────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.classList.remove('show'); }));

// YENİ ÖZELLİK — CSV dışa aktarma
function exportOrders() {
  const url = `${API}/admin/export/orders`;
  // Bearer token ile dosya indirmek için geçici link açılır
  fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => {
      if (!r.ok) throw new Error('İndirme başarısız.');
      return r.blob();
    })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `perakafe_siparisler_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('CSV indirildi ✓');
    })
    .catch(e => showToast(e.message, 'err'));
}

let toastTimer = null;
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = (type==='ok'?'✓ ':'')+msg;
  t.className = 'show '+(type==='err'?'err':'ok');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className='', 3000);
}

//  7 — SATIŞ RAPORLARI
// ══════════════════════════════════════════════════════════════
async function loadReports() {
  setRefreshTime();
  document.getElementById('content').innerHTML = `
    <div class="stats-grid" id="rep-summary" style="margin-bottom:20px">
      <div class="stat-card purple"><div class="label">Yükleniyor</div><div class="value">...</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px" id="rep-top-grid">
      <div class="section"><div class="section-header"><h3>🏆 En Çok Satanlar</h3></div>
        <div id="rep-top" style="padding:16px"><span class="spinner"></span></div></div>
      <div class="section"><div class="section-header"><h3>🏷️ Kategori Bazlı Ciro</h3></div>
        <div id="rep-cat" style="padding:16px"><span class="spinner"></span></div></div>
    </div>
    <div class="section"><div class="section-header"><h3>🕐 Saatlik Yoğunluk (Son 30 Gün)</h3></div>
      <div id="rep-hourly" style="padding:16px 20px 20px"><span class="spinner"></span></div>
    </div>`;

  try {
    const [topProds, hourly, cats] = await Promise.all([
      apiFetch('/admin/reports/top-products?limit=8'),
      apiFetch('/admin/reports/hourly'),
      apiFetch('/admin/reports/categories'),
    ]);

    // Özet kartlar
    const totalRev  = topProds.reduce((s,r)=>s+r.total_revenue,0);
    const totalQty  = topProds.reduce((s,r)=>s+r.total_qty,0);
    const topCat    = cats[0]?.CategoryName || '—';
    const topProd   = topProds[0]?.ProductName || '—';
    document.getElementById('rep-summary').innerHTML = `
      <div class="stat-card green"><div class="label">Toplam Satış (₺)</div>
        <div class="value">${totalRev.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</div>
        <div class="sub">İptal edilmeyenler</div></div>
      <div class="stat-card blue"><div class="label">Toplam Adet</div>
        <div class="value">${totalQty.toLocaleString('tr-TR')}</div>
        <div class="sub">Satılan ürün</div></div>
      <div class="stat-card purple"><div class="label">En İyi Kategori</div>
        <div class="value" style="font-size:18px">${topCat}</div>
        <div class="sub">Ciro liderliği</div></div>
      <div class="stat-card orange"><div class="label">En Çok Satan</div>
        <div class="value" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${topProd}</div>
        <div class="sub">${topProds[0]?.total_qty||0} adet</div></div>`;

    // En çok satanlar — yatay bar chart
    const maxQty = Math.max(...topProds.map(r=>r.total_qty),1);
    document.getElementById('rep-top').innerHTML = topProds.map(p=>{
      const pct = Math.round((p.total_qty/maxQty)*100);
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:600;color:var(--text)">${p.ProductName}</span>
          <span style="color:var(--text2)">${p.total_qty} adet · ${p.total_revenue.toLocaleString('tr-TR',{maximumFractionDigits:0})}₺</span>
        </div>
        <div style="background:var(--surface3);border-radius:4px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:4px;transition:width .5s"></div>
        </div></div>`;
    }).join('');

    // Kategori pasta benzeri tablo
    const maxCatRev = Math.max(...cats.map(r=>r.total_revenue),1);
    const catColors = ['var(--accent)','var(--green)','var(--blue)','var(--orange)','var(--red)','#1ABC9C','#9B59B6'];
    document.getElementById('rep-cat').innerHTML = cats.map((cat,i)=>{
      const pct = Math.round((cat.total_revenue/maxCatRev)*100);
      const col = catColors[i % catColors.length];
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:600;color:var(--text)">${cat.CategoryName}</span>
          <span style="color:var(--text2)">${cat.total_revenue.toLocaleString('tr-TR',{maximumFractionDigits:0})}₺</span>
        </div>
        <div style="background:var(--surface3);border-radius:4px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${col};border-radius:4px;transition:width .5s"></div>
        </div></div>`;
    }).join('');

    // Saatlik — dikey bar chart (24 saat)
    const maxH = Math.max(...hourly.map(r=>r.order_count),1);
    const peakH = hourly.reduce((a,b)=>b.order_count>a.order_count?b:a,hourly[0]);
    document.getElementById('rep-hourly').innerHTML = `
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px">
        En yoğun saat: <strong style="color:var(--accent)">${String(peakH.hour).padStart(2,'0')}:00</strong>
        — ${peakH.order_count} sipariş
      </div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:90px;overflow:hidden">
        ${hourly.map(h=>{
          const ht = Math.max(4,Math.round((h.order_count/maxH)*82));
          const isNight = h.hour<7||h.hour>22;
          const isPeak  = h.hour===peakH.hour;
          const col = isPeak?'var(--accent)':isNight?'var(--surface3)':'var(--accent2,var(--accent))';
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="${String(h.hour).padStart(2,'0')}:00 — ${h.order_count} sipariş">
            <div style="font-size:8px;color:var(--text3)">${h.order_count||''}</div>
            <div style="width:100%;height:${ht}px;background:${col};border-radius:3px 3px 0 0;opacity:${isPeak?1:.7};transition:height .4s"></div>
            <div style="font-size:8px;color:var(--text3)">${h.hour%3===0?String(h.hour).padStart(2,'0'):''}</div>
          </div>`;
        }).join('')}
      </div>`;

  } catch(e) { showToast(e.message,'err'); }
}

// ══════════════════════════════════════════════════════════════
//  KAMPANYALAR
// ══════════════════════════════════════════════════════════════
let editingCampId = null;
let selectedColor = '#27AE60';
let campCats  = null;   // kapsam seçimi için kategori önbelleği
let campProds = null;   // kapsam seçimi için ürün önbelleği

const CAMP_TYPE_LABELS = {
    buy_x_get_y: (c) => `${c.buy} ALANA ${c.get} BEDAVA`,
    percentage:  (c) => `%${c.percent} İNDİRİM`,
    fixed:       (c) => `${c.amount}₺ İNDİRİM`,
};

// Kapsam (scope) için kategori + ürün listelerini bir kez yükleyip önbelleğe al
async function ensureCampTargets() {
    try {
        if (!campCats)  campCats  = await apiFetch('/admin/categories');
        if (!campProds) campProds = await apiFetch('/admin/products');
    } catch(e) { campCats = campCats || []; campProds = campProds || []; }
}

function campScopeCheckbox(id, label, selectedSet) {
    const checked = selectedSet.has(Number(id)) ? 'checked' : '';
    return `<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0">
        <input type="checkbox" class="camp-target-cb" value="${id}" ${checked}>
        <span>${label}</span></label>`;
}

function applyCampScopeVisibility() {
    const type = document.getElementById('camp-scope').value;
    document.getElementById('camp-scope-targets').style.display = type === 'all' ? 'none' : 'block';
    document.getElementById('camp-scope-label').textContent = type === 'category' ? 'Kategoriler' : 'Ürünler';
}

function renderCampScopeList(selectedIds) {
    const type = document.getElementById('camp-scope').value;
    const box  = document.getElementById('camp-scope-list');
    if (type === 'all') { box.innerHTML = ''; return; }
    const sel = new Set((selectedIds || []).map(Number));
    if (type === 'category') {
        const cats = campCats || [];
        box.innerHTML = cats.length
            ? cats.map(c => campScopeCheckbox(c.CategoryID, c.CategoryName, sel)).join('')
            : '<div style="color:var(--text2);font-size:12px">Kategori bulunamadı.</div>';
    } else {
        const prods = campProds || [];
        if (!prods.length) { box.innerHTML = '<div style="color:var(--text2);font-size:12px">Ürün bulunamadı.</div>'; return; }
        // Ürünleri kategoriye göre grupla (okunabilirlik için)
        const byCat = {};
        prods.forEach(p => { (byCat[p.CategoryName] = byCat[p.CategoryName] || []).push(p); });
        box.innerHTML = Object.keys(byCat).map(cat =>
            `<div style="font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">${cat}</div>` +
            byCat[cat].map(p => campScopeCheckbox(p.ProductID, p.ProductName, sel)).join('')
        ).join('');
    }
}

// Kapsam tipi değişince: görünürlüğü güncelle ve listeyi (seçim sıfırlanarak) yeniden çiz
function updateCampScope() {
    applyCampScopeVisibility();
    renderCampScopeList([]);
}

async function loadCampaigns() {
    setRefreshTime();
    document.getElementById('content').innerHTML = `
        <div class="section">
          <div class="section-header">
            <h3>🎁 Kampanyalar</h3>
            <button class="btn btn-sm btn-green" onclick="openCampModal()"><i class="fas fa-plus"></i> Yeni Kampanya</button>
          </div>
          <div id="camp-list" style="padding:16px;display:flex;flex-direction:column;gap:10px">
            <div style="text-align:center;color:var(--text2);padding:20px"><span class="spinner"></span>Yükleniyor...</div>
          </div>
        </div>`;
    try {
        await ensureCampTargets();   // kapsam adlarını gösterebilmek için kategori/ürün önbelleği
        const camps = await apiFetch('/admin/campaigns');
        renderCampaignList(camps);
    } catch(e) { showToast(e.message, 'err'); }
}

// Kampanyanın kapsamını okunabilir metne çevir (admin kart için)
function campScopeText(c) {
    if (!c.scope_type || c.scope_type === 'all') return '🎯 Tüm ürünler';
    const ids = c.scope_ids || [];
    if (!ids.length) return '🎯 Hedef seçilmemiş';
    if (c.scope_type === 'category') {
        const map = {}; (campCats  || []).forEach(x => map[x.CategoryID] = x.CategoryName);
        const names = ids.map(id => map[id]).filter(Boolean);
        return '🎯 ' + (names.length ? names.join(', ') : `${ids.length} kategori`);
    }
    const map = {}; (campProds || []).forEach(x => map[x.ProductID] = x.ProductName);
    const names = ids.map(id => map[id]).filter(Boolean);
    return '🎯 ' + (names.length ? names.join(', ') : `${ids.length} ürün`);
}

function renderCampaignList(list) {
    const box = document.getElementById('camp-list');
    if (!list.length) {
        box.innerHTML = '<div style="text-align:center;color:var(--text2);padding:30px">Henüz kampanya yok. Yeni ekleyebilirsiniz.</div>';
        return;
    }
    box.innerHTML = list.map(c => {
        const labelFn = CAMP_TYPE_LABELS[c.type];
        const badge   = labelFn ? labelFn(c.config) : c.type;
        const color   = c.badge_color || '#E67E22';
        const dates   = c.start_date || c.end_date
            ? `📅 ${c.start_date || 'Başlangıç yok'} → ${c.end_date || 'Bitiş yok'}`
            : 'Tarih sınırı yok';
        return `
        <div class="camp-card" id="camp-${c.id}">
          <div style="margin-top:2px">
            <span class="camp-badge" style="background:${color}">${badge}</span>
          </div>
          <div class="camp-info">
            <div class="camp-title">${c.title}</div>
            ${c.description ? `<div class="camp-desc">${c.description}</div>` : ''}
            <div class="camp-meta">${dates}</div>
            <div class="camp-meta">${campScopeText(c)}</div>
          </div>
          <div class="camp-actions">
            <label class="toggle-switch" title="${c.is_active ? 'Aktif — kapat' : 'Pasif — aç'}">
              <input type="checkbox" ${c.is_active ? 'checked' : ''} onchange="toggleCamp(${c.id}, this.checked)">
              <span class="toggle-slider"></span>
            </label>
            <button class="btn btn-sm btn-blue" onclick="editCamp(${c.id})"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-red"  onclick="deleteCamp(${c.id})"><i class="fas fa-trash"></i></button>
          </div>
        </div>`;
    }).join('');
}

function updateCampFields() {
    const t = document.getElementById('camp-type').value;
    document.getElementById('camp-fields-buy').style.display = t === 'buy_x_get_y' ? 'flex' : 'none';
    document.getElementById('camp-fields-pct').style.display = t === 'percentage'  ? 'block' : 'none';
    document.getElementById('camp-fields-fix').style.display = t === 'fixed'       ? 'block' : 'none';
}

function selectColor(el) {
    document.querySelectorAll('#camp-colors .color-dot').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    selectedColor = el.dataset.color;
    document.getElementById('camp-color-custom').value = selectedColor;
}

function selectCustomColor(val) {
    selectedColor = val;
    document.querySelectorAll('#camp-colors .color-dot').forEach(d => d.classList.remove('active'));
}

async function openCampModal(camp = null) {
    await ensureCampTargets();
    editingCampId = camp ? camp.id : null;
    document.getElementById('camp-modal-title').textContent = camp ? 'Kampanya Düzenle' : 'Yeni Kampanya';
    document.getElementById('camp-title').value  = camp?.title || '';
    document.getElementById('camp-desc').value   = camp?.description || '';
    document.getElementById('camp-start').value  = camp?.start_date || '';
    document.getElementById('camp-end').value    = camp?.end_date || '';
    document.getElementById('camp-active').checked = camp ? Boolean(camp.is_active) : true;

    const type = camp?.type || 'buy_x_get_y';
    document.getElementById('camp-type').value = type;
    updateCampFields();

    if (camp?.config) {
        if (type === 'buy_x_get_y') {
            document.getElementById('camp-buy').value = camp.config.buy ?? 2;
            document.getElementById('camp-get').value = camp.config.get ?? 1;
        } else if (type === 'percentage') {
            document.getElementById('camp-pct').value = camp.config.percent ?? 10;
        } else {
            document.getElementById('camp-fix').value = camp.config.amount ?? 20;
        }
    } else {
        document.getElementById('camp-buy').value = 2;
        document.getElementById('camp-get').value = 1;
        document.getElementById('camp-pct').value = 10;
        document.getElementById('camp-fix').value = 20;
    }

    // Renk
    selectedColor = camp?.badge_color || '#27AE60';
    document.getElementById('camp-color-custom').value = selectedColor;
    document.querySelectorAll('#camp-colors .color-dot').forEach(d => {
        d.classList.toggle('active', d.dataset.color === selectedColor);
    });

    // Kapsam (scope)
    document.getElementById('camp-scope').value = camp?.scope_type || 'all';
    applyCampScopeVisibility();
    renderCampScopeList(camp?.scope_ids || []);

    openModal('camp-modal');
}

async function editCamp(id) {
    try {
        const camps = await apiFetch('/admin/campaigns');
        const camp  = camps.find(c => c.id === id);
        if (camp) openCampModal(camp);
    } catch(e) { showToast(e.message,'err'); }
}

async function toggleCamp(id, active) {
    try {
        await apiFetch(`/admin/campaigns/${id}`, {method:'PATCH', body:{is_active: active}});
        showToast(active ? 'Kampanya aktif edildi ✓' : 'Kampanya pasife alındı ✓');
    } catch(e) { showToast(e.message,'err'); loadCampaigns(); }
}

async function deleteCamp(id) {
    if (!confirm('Bu kampanyayı kalıcı olarak silmek istediğinize emin misiniz?')) return;
    try {
        await apiFetch(`/admin/campaigns/${id}`, {method:'DELETE'});
        showToast('Kampanya silindi ✓');
        loadCampaigns();
    } catch(e) { showToast(e.message,'err'); }
}

async function saveCampaign() {
    const title  = document.getElementById('camp-title').value.trim();
    const desc   = document.getElementById('camp-desc').value.trim();
    const type   = document.getElementById('camp-type').value;
    const active = document.getElementById('camp-active').checked;
    const start  = document.getElementById('camp-start').value || null;
    const end    = document.getElementById('camp-end').value   || null;

    if (!title) { showToast('Başlık zorunludur.','err'); return; }

    let config = {};
    if (type === 'buy_x_get_y') {
        const buy = parseInt(document.getElementById('camp-buy').value);
        const get = parseInt(document.getElementById('camp-get').value);
        if (isNaN(buy)||isNaN(get)||buy<1||get<1) { showToast('Geçerli değerler girin.','err'); return; }
        config = {buy, get};
    } else if (type === 'percentage') {
        const pct = parseInt(document.getElementById('camp-pct').value);
        if (isNaN(pct)||pct<1||pct>100) { showToast('Geçerli oran girin (1-100).','err'); return; }
        config = {percent: pct};
    } else {
        const amt = parseFloat(document.getElementById('camp-fix').value);
        if (isNaN(amt)||amt<1) { showToast('Geçerli tutar girin.','err'); return; }
        config = {amount: amt};
    }

    // Kapsam (scope): hangi ürünlere uygulanacak
    const scopeType = document.getElementById('camp-scope').value;
    let scopeIds = [];
    if (scopeType !== 'all') {
        scopeIds = [...document.querySelectorAll('#camp-scope-list .camp-target-cb:checked')].map(cb => parseInt(cb.value));
        if (!scopeIds.length) {
            showToast(scopeType === 'category' ? 'En az bir kategori seçin.' : 'En az bir ürün seçin.', 'err');
            return;
        }
    }

    const body = {title, description: desc, type, config, badge_color: selectedColor, is_active: active, start_date: start, end_date: end, scope_type: scopeType, scope_ids: scopeIds};

    try {
        if (editingCampId) {
            await apiFetch(`/admin/campaigns/${editingCampId}`, {method:'PATCH', body});
            showToast('Kampanya güncellendi ✓');
        } else {
            await apiFetch('/admin/campaigns', {method:'POST', body});
            showToast('Kampanya eklendi ✓');
        }
        closeModal('camp-modal');
        loadCampaigns();
    } catch(e) { showToast(e.message,'err'); }
}

  document.getElementById('main').style.opacity='0.3';
  document.getElementById('sidebar').style.opacity='0.3';
  setTimeout(()=>document.getElementById('login-pass').focus(), 100);
}
