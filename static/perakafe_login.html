<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pera Kafe - Giriş</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap');
  :root {
    --color-primary: #6F4E37;
    --color-primary-hover: #4A3323;
    --color-primary-light: #C4A48A;
    --color-primary-shadow: rgba(111,78,55,.15);
    --color-background-tertiary: #F4EFEA;
    --color-background-secondary: #FAFAF7;
    --color-background-primary: #FFFFFF;
    --color-border-tertiary: #E8E0D5;
    --color-border-secondary: #D7CCC0;
    --color-border-danger: #E57373;
    --color-text-primary: #3E2723;
    --color-text-secondary: #5D4037;
    --color-text-tertiary: #8D6E63;
    --color-text-danger: #D32F2F;
    --color-text-success: #388E3C;
    --color-background-danger: #FFEBEE;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, monospace;
    --border-radius-xl: 20px;
    --border-radius-lg: 16px;
    --border-radius-md: 10px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  .app{min-height:100vh;background:var(--color-background-tertiary);display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font-sans)}
  .card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-xl);padding:36px 32px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(62,39,35,.05)}

  /* ── DİL SEÇİCİ ── */
  .lang-bar{display:flex;justify-content:center;gap:6px;margin-bottom:28px}
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    padding:7px 16px;border-radius:50px;
    border:1.5px solid var(--color-border-secondary);
    background:transparent;
    font-family:var(--font-sans);font-size:13px;font-weight:500;
    color:var(--color-text-secondary);cursor:pointer;
    transition:all .2s;
  }
  .lang-btn:hover{background:var(--color-background-secondary)}
  .lang-btn.active{
    background:var(--color-primary);
    border-color:var(--color-primary);
    color:#fff;
  }
  .lang-flag{font-size:16px;line-height:1}

  /* ── LOGO ── */
  .logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-bottom:32px;text-align:center}
  .logo-mark{width:72px;height:72px;border-radius:50%;overflow:hidden;box-shadow:0 8px 16px var(--color-primary-shadow);border:3px solid #fff;background:var(--color-background-primary);display:flex;align-items:center;justify-content:center}
  .logo-mark img{width:100%;height:100%;object-fit:cover}
  .logo-text{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;font-style:italic;color:var(--color-primary);letter-spacing:-.5px;line-height:1}
  .logo-sub{font-size:11px;font-weight:600;color:var(--color-text-tertiary);letter-spacing:3px;text-transform:uppercase;margin-top:6px;position:relative;display:inline-block}
  .logo-sub::before,.logo-sub::after{content:'';position:absolute;top:50%;width:24px;height:1px;background:var(--color-border-secondary)}
  .logo-sub::before{right:100%;margin-right:10px}
  .logo-sub::after{left:100%;margin-left:10px}

  /* ── EKRANLAR ── */
  .screen{display:none}
  .screen.active{display:block}
  h2{font-size:16px;font-weight:600;color:var(--color-text-primary);margin-bottom:6px}
  .sub{font-size:13px;color:var(--color-text-secondary);margin-bottom:24px;line-height:1.5}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:6px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
  .phone-wrap{display:flex;align-items:center;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden;background:var(--color-background-primary);transition:border-color .15s,box-shadow .15s}
  .phone-wrap:focus-within{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-shadow)}
  .phone-wrap.error{border-color:var(--color-border-danger)}
  .phone-prefix{padding:0 12px;font-size:14px;color:var(--color-text-secondary);border-right:.5px solid var(--color-border-tertiary);height:40px;display:flex;align-items:center;background:var(--color-background-secondary);white-space:nowrap}
  .phone-wrap input{border:none;outline:none;padding:0 12px;font-size:14px;color:var(--color-text-primary);background:transparent;height:40px;width:100%;font-family:var(--font-mono)}
  input[type=text]{border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:0 12px;font-size:14px;height:40px;width:100%;outline:none;color:var(--color-text-primary);background:var(--color-background-primary);transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-shadow)}
  .btn-primary{width:100%;height:42px;background:var(--color-primary);color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s;margin-top:8px}
  .btn-primary:hover{background:var(--color-primary-hover)}
  .btn-primary:active{transform:scale(.98)}
  .btn-primary:disabled{background:var(--color-primary-light);cursor:not-allowed}
  .btn-outline{width:100%;height:42px;background:transparent;color:var(--color-text-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s;margin-top:8px}
  .btn-outline:hover{background:var(--color-background-secondary)}
  .btn-outline:active{transform:scale(.98)}
  .btn-ghost{width:100%;height:36px;background:transparent;color:var(--color-text-secondary);border:none;font-size:13px;font-weight:500;cursor:pointer;margin-top:4px;border-radius:var(--border-radius-md);transition:color .15s}
  .btn-ghost:hover{color:var(--color-text-primary)}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
  .divider span{font-size:12px;color:var(--color-text-tertiary);white-space:nowrap;font-weight:500}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--color-border-tertiary)}
  .error-msg{font-size:12px;color:var(--color-text-danger);margin-top:6px;display:none;align-items:center;gap:5px}
  .error-msg.show{display:flex}
  .error-icon{width:14px;height:14px;background:var(--color-background-danger);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .success-msg{font-size:12px;color:var(--color-text-success);margin-top:6px;display:none;align-items:center;gap:5px}
  .success-msg.show{display:flex}
  .back-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;background:none;border:none;padding:0;margin-bottom:24px;transition:color .15s}
  .back-btn:hover{color:var(--color-text-primary)}
  .back-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .steps{display:flex;gap:6px;margin-bottom:28px}
  .step{height:4px;border-radius:2px;flex:1;background:var(--color-border-tertiary);transition:background .3s}
  .step.done{background:var(--color-primary)}
  .welcome-box{background:#F0E8DF;border-radius:var(--border-radius-lg);padding:16px;margin-bottom:24px;border:1px solid #E8E0D5}
  .welcome-name{font-size:15px;font-weight:600;color:var(--color-text-primary)}
  .welcome-sub{font-size:12px;color:var(--color-text-secondary);margin-top:4px}
  .input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:11px;color:var(--color-text-tertiary);margin-top:4px}
  .loading-dots{display:inline-flex;gap:3px;align-items:center}
  .loading-dots span{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;animation:dot .9s infinite}
  .loading-dots span:nth-child(2){animation-delay:.15s}
  .loading-dots span:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,80%,100%{opacity:0}40%{opacity:1}}

  /* ── CİNSİYET SEÇİCİ ── */
  .gender-bar{display:flex;gap:10px;margin-bottom:20px}
  .gender-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 16px;border-radius:var(--border-radius-md);
    border:1.5px solid var(--color-border-secondary);
    background:transparent;
    font-family:var(--font-sans);font-size:14px;font-weight:500;
    color:var(--color-text-secondary);cursor:pointer;
    transition:all .2s;
  }
  .gender-btn:hover{background:var(--color-background-secondary)}
  .gender-btn.active{
    background:var(--color-primary);
    border-color:var(--color-primary);
    color:#fff;
    box-shadow:0 4px 12px var(--color-primary-shadow);
  }
  .gender-icon{font-size:18px;line-height:1}
  </style>
</head>
<body>
<div class="app">
<div class="card">

  <!-- DİL SEÇİCİ -->
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="tr" onclick="setLang('tr')">
      <span class="lang-flag">🇹🇷</span> Türkçe
    </button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">
      <span class="lang-flag">🇬🇧</span> English
    </button>
    <button class="lang-btn" data-lang="ar" onclick="setLang('ar')">
      <span class="lang-flag">🇸🇦</span> العربية
    </button>
  </div>

  <!-- LOGO -->
  <div class="logo">
    <div class="logo-mark">
      <img src="pera cafe yazisiz.png" alt="Pera Kafe" onerror="this.src='https://via.placeholder.com/72?text=PK'">
    </div>
    <div>
      <div class="logo-text">Pera Kafe</div>
      <div class="logo-sub" id="logo-sub">sipariş sistemi</div>
    </div>
  </div>

  <!-- GİRİŞ EKRANI -->
  <div id="s-login" class="screen active">
    <h2 id="txt-welcome-title">Hoş geldiniz</h2>
    <p class="sub" id="txt-welcome-sub">Telefon numaranızla giriş yapın veya misafir olarak devam edin.</p>
    <div class="gender-bar">
      <button class="gender-btn active" id="gender-female" onclick="setGender('female')">
        <span class="gender-icon">👩</span>
        <span id="txt-gender-female">Kadın</span>
      </button>
      <button class="gender-btn" id="gender-male" onclick="setGender('male')">
        <span class="gender-icon">👨</span>
        <span id="txt-gender-male">Erkek</span>
      </button>
    </div>
    <div class="field">
      <label id="txt-phone-label">Telefon numarası</label>
      <div class="phone-wrap" id="phone-wrap">
        <div class="phone-prefix">+90</div>
        <input type="text" id="phone-input" placeholder="5XX XXX XX XX" maxlength="13"
               inputmode="numeric" autocomplete="tel"
               onkeypress="if(event.key==='Enter') doLogin()"/>
      </div>
      <div class="error-msg" id="phone-error">
        <div class="error-icon"><svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="var(--color-text-danger)" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="6" y2="6"/><line x1="6" y1="2" x2="2" y2="6"/></svg></div>
        <span id="phone-error-text"></span>
      </div>
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()"></button>
    <div class="divider"><span id="txt-or">veya</span></div>
    <button class="btn-outline" onclick="goGuest()" id="btn-guest"></button>
    <button class="btn-ghost"   onclick="goRegister()" id="btn-register-link"></button>
  </div>

  <!-- KAYIT EKRANI -->
  <div id="s-register" class="screen">
    <button class="back-btn" onclick="goBack('s-login')">
      <svg viewBox="0 0 14 14"><polyline points="9,2 4,7 9,12"/></svg>
      <span id="txt-back">Geri</span>
    </button>
    <div class="steps"><div class="step done"></div><div class="step" id="rs2"></div></div>
    <h2 id="txt-reg-title">Hesap oluştur</h2>
    <p class="sub" id="txt-reg-sub">Birkaç bilgiyle hemen üye olun.</p>
    <div class="input-row">
      <div class="field">
        <label id="txt-name-label">Ad</label>
        <input type="text" id="reg-name" placeholder="Ahmet"/>
      </div>
      <div class="field">
        <label id="txt-surname-label">Soyad</label>
        <input type="text" id="reg-surname" placeholder="Yılmaz"/>
      </div>
    </div>
    <div class="field">
      <label id="txt-phone-label2">Telefon numarası</label>
      <div class="phone-wrap" id="reg-phone-wrap">
        <div class="phone-prefix">+90</div>
        <input type="text" id="reg-phone" placeholder="5XX XXX XX XX" maxlength="13"
               inputmode="numeric" autocomplete="tel"
               onkeypress="if(event.key==='Enter') doRegister()"/>
      </div>
      <div class="hint" id="txt-phone-hint">10 haneli numara giriniz (5XX ile başlamalı)</div>
      <div class="error-msg" id="reg-error">
        <div class="error-icon"><svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="var(--color-text-danger)" stroke-width="1.5" stroke-linecap="round"><line x1="2" y1="2" x2="6" y2="6"/><line x1="6" y1="2" x2="2" y2="6"/></svg></div>
        <span id="reg-error-text"></span>
      </div>
    </div>
    <button class="btn-primary" id="btn-register" onclick="doRegister()"></button>
  </div>

  <!-- KAYIT BAŞARILI -->
  <div id="s-success" class="screen">
    <button class="back-btn" onclick="goBack('s-login')">
      <svg viewBox="0 0 14 14"><polyline points="9,2 4,7 9,12"/></svg>
      <span id="txt-back2"></span>
    </button>
    <div class="steps"><div class="step done"></div><div class="step done"></div></div>
    <div class="welcome-box">
      <div class="welcome-name" id="welcome-name">Merhaba!</div>
      <div class="welcome-sub" id="welcome-sub"></div>
    </div>
    <h2 id="txt-reg-done-title"></h2>
    <p class="sub" id="txt-reg-done-sub"></p>
    <button class="btn-primary" onclick="goBack('s-login')" id="btn-go-login"></button>
  </div>

  <!-- HOŞ GELDİN -->
  <div id="s-welcome" class="screen">
    <div class="welcome-box">
      <div class="welcome-name" id="member-name">Merhaba!</div>
      <div class="welcome-sub" id="txt-seen-again"></div>
    </div>
    <h2 id="txt-ready-title"></h2>
    <p class="sub" id="txt-ready-sub"></p>
    <button class="btn-primary" onclick="goToCafe()" id="btn-start"></button>
    <button class="btn-ghost" onclick="logout()" id="btn-other-account"></button>
  </div>

  <!-- MİSAFİR -->
  <div id="s-guest" class="screen">
    <div class="welcome-box" style="background:var(--color-background-secondary);border-color:var(--color-border-secondary)">
      <div class="welcome-name" id="txt-guest-title" style="color:var(--color-text-primary)"></div>
      <div class="welcome-sub"  id="txt-guest-sub"   style="color:var(--color-text-secondary)"></div>
    </div>
    <h2 id="txt-guest-ready"></h2>
    <p class="sub" id="txt-guest-desc"></p>
    <button class="btn-primary" onclick="guestLogin()" id="btn-guest-start"></button>
    <button class="btn-ghost"   onclick="goBack('s-login')" id="btn-guest-back"></button>
  </div>

</div>
</div>

  currentLang = lang;
  localStorage.setItem('peraLang', lang);
  applyLang();
}

    b.classList.toggle('active', b.dataset.lang === currentLang);
  });

  // Metinleri güncelle
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };

  set('txt-gender-male',   t.genderMale);
  set('logo-sub',          t.logoSub);

  set('btn-login',         t.btnLogin);
  set('txt-or',            t.or);
  set('btn-guest',         t.btnGuest);
  set('btn-register-link', t.btnRegisterLink);
  set('txt-back',          t.back);
  set('txt-back2',         t.back);

  set('txt-reg-sub',       t.regSub);

// ══════════════════════════════════════════════════════
//  TELEFON FORMAT
// ══════════════════════════════════════════════════════
function formatPhone(val) {
  let d = val.replace(/\D/g,'');
  if(d.length>10) d=d.slice(0,10);
  let out='';
  if(d.length>0) out=d.slice(0,3);
  if(d.length>3) out+=' '+d.slice(3,6);
  if(d.length>6) out+=' '+d.slice(6,8);
  if(d.length>8) out+=' '+d.slice(8,10);
  return out;
}
function rawPhone(el){return el.value.replace(/\D/g,'');}

document.getElementById('phone-input').addEventListener('input',function(){
  this.value=formatPhone(this.value);
  document.getElementById('phone-wrap').classList.remove('error');
  document.getElementById('phone-error').classList.remove('show');
});
document.getElementById('reg-phone').addEventListener('input',function(){
  this.value=formatPhone(this.value);
  document.getElementById('reg-phone-wrap').classList.remove('error');
  document.getElementById('reg-error').classList.remove('show');
});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goBack(t){showScreen(t);}
function goGuest(){showScreen('s-guest');}
function goRegister(){showScreen('s-register');}

function logout(){localStorage.removeItem('userName');window.location.reload();}

function guestLogin(){
  localStorage.setItem('userName','Misafir');

}

// ══════════════════════════════════════════════════════
//  GİRİŞ YAP
// ══════════════════════════════════════════════════════
async function doLogin(){
  const t   = LANG[currentLang];
  const inp = document.getElementById('phone-input');
  const raw = rawPhone(inp);
  const btn = document.getElementById('btn-login');
  const wrap= document.getElementById('phone-wrap');
  const err = document.getElementById('phone-error');
  const errTxt=document.getElementById('phone-error-text');

  if(raw.length!==10){
    wrap.classList.add('error');
    errTxt.textContent=t.errShortPhone;
    err.classList.add('show');
    wrap.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300,iterations:2});
    return;
  }

  btn.disabled=true;
  btn.innerHTML=t.checking+' <span class="loading-dots"><span></span><span></span><span></span></span>';

  try{
    const res=await fetch('/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:raw})
    });
    const data=await res.json();

    setTimeout(()=>{
      btn.disabled=false;
      btn.textContent=t.btnLogin;
      if(data.success){
        localStorage.setItem('userName',data.name);
        document.getElementById('member-name').textContent='👋 '+data.name;
        showScreen('s-welcome');
      } else {
        wrap.classList.add('error');
        errTxt.textContent=t.errAskRegister;
        err.classList.add('show');
        wrap.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300,iterations:2});
      }
    },800);
  }catch(e){
    btn.disabled=false;
    btn.textContent=t.btnLogin;
    wrap.classList.add('error');
    errTxt.textContent=t.errNoServer;
    err.classList.add('show');
  }
}

// ══════════════════════════════════════════════════════
//  KAYIT OL
// ══════════════════════════════════════════════════════
async function doRegister(){
  const t       = LANG[currentLang];
  const name    = document.getElementById('reg-name').value.trim();
  const surname = document.getElementById('reg-surname').value.trim();
  const phoneEl = document.getElementById('reg-phone');
  const raw     = rawPhone(phoneEl);
  const wrap    = document.getElementById('reg-phone-wrap');
  const err     = document.getElementById('reg-error');
  const errTxt  = document.getElementById('reg-error-text');
  const btn     = document.getElementById('btn-register');

  err.classList.remove('show');
  wrap.classList.remove('error');

  if(!name||!surname){
    errTxt.textContent=t.errNameRequired;
    err.classList.add('show');
    return;
  }
  if(raw.length!==10||!raw.startsWith('5')){
    wrap.classList.add('error');
    errTxt.textContent=t.errBadPhone;
    err.classList.add('show');
    wrap.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300,iterations:2});
    return;
  }

  btn.disabled=true;
  btn.innerHTML=t.saving+' <span class="loading-dots"><span></span><span></span><span></span></span>';

  try{
    const res=await fetch('/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:raw,first_name:name,last_name:surname})
    });
    const data=await res.json();

    setTimeout(()=>{
      btn.disabled=false;
      btn.textContent=t.btnRegister;
      if(data.success){
        document.getElementById('welcome-name').textContent='👋 '+name+'!';
        document.getElementById('welcome-sub').textContent=t.regWelcomeSub+' (+90 '+formatPhone(raw)+')';
        showScreen('s-success');
      } else {
        wrap.classList.add('error');
        errTxt.textContent=data.message||t.errDuplicate;
        err.classList.add('show');
        wrap.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300,iterations:2});
      }
    },1000);
  }catch(e){
    btn.disabled=false;
    btn.textContent=t.btnRegister;
    wrap.classList.add('error');
    errTxt.textContent=t.errNoServer;
    err.classList.add('show');
  }
}
</script>
