<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişlerim — Pera Kafe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="perakafe.css">
    <style>
        /* Bu sayfaya özel: index.html body'si overflow:hidden olduğu için
           kendi kaydırılabilir kapsayıcımızı kuruyoruz. Renkler perakafe.css
           tema değişkenlerinden gelir, böylece 4 tema da otomatik çalışır. */
        .orders-wrap { flex:1; overflow-y:auto; padding:20px 16px 40px; }
        .orders-inner { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
        .section-title { font-size:14px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:8px; margin:6px 0 2px; }

        /* Canlı takip kartı */
        .live-card { background:var(--bg-surface); border:1.5px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
        .live-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
        .live-id { font-size:15px; font-weight:700; color:var(--text-main); }
        .live-dot { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:#fff; background:#E74C3C; padding:4px 10px; border-radius:999px; }
        .live-dot::before { content:''; width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse-dot 1.2s ease-in-out infinite; }
        .live-empty { background:var(--bg-card); border:1px dashed var(--border); border-radius:14px; padding:22px; text-align:center; color:var(--text-muted); font-size:13px; }
        .live-cancelled { text-align:center; color:#E74C3C; font-weight:600; font-size:13px; margin-top:6px; }

        /* Geçmiş sipariş kartları */
        .order-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
        .order-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
        .order-no { font-size:14px; font-weight:700; color:var(--text-main); }
        .order-date { font-size:11px; color:var(--text-muted); margin-bottom:8px; }
        .order-items { font-size:12px; color:var(--text-sub); line-height:1.5; }
        .order-total { font-size:15px; font-weight:700; color:var(--accent); text-align:right; margin-top:8px; }
        .status-badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
        .st-pending   { background:rgba(241,196,15,.18);  color:#B7950B; }
        .st-preparing { background:rgba(230,126,34,.18);  color:#CA6F1E; }
        .st-ready     { background:rgba(39,174,96,.18);   color:#1E8449; }
        .st-completed { background:rgba(127,140,141,.18); color:#566573; }
        .st-cancelled { background:rgba(231,76,60,.18);   color:#C0392B; }

        .hist-empty { text-align:center; color:var(--text-muted); font-size:13px; padding:24px 0; }
        .hist-loading { text-align:center; color:var(--text-muted); font-size:13px; padding:24px 0; }
        .back-btn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:5px 12px; color:var(--topbar-text); font-size:13px; font-weight:600; cursor:pointer; }
        .back-btn:hover { background:rgba(255,255,255,.22); }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button class="back-btn" onclick="window.location.href='index.html'" title="Geri">
            <i class="fas fa-arrow-left"></i> Geri
        </button>
        <span class="topbar-brand" style="margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)">📦 Siparişlerim</span>
    </div>
    <div class="topbar-right">
        <div class="theme-swatches">
            <div class="swatch" style="background:#F5F1E8" data-theme="light"    onclick="setTheme('light')"></div>
            <div class="swatch" style="background:#1A1208" data-theme="dark"     onclick="setTheme('dark')"></div>
            <div class="swatch" style="background:#0D1B2A" data-theme="darkblue" onclick="setTheme('darkblue')"></div>
            <div class="swatch" style="background:#1B1B1B" data-theme="midnight" onclick="setTheme('midnight')"></div>
        </div>
    </div>
</div>

<!-- İÇERİK -->
<div class="orders-wrap">
    <div class="orders-inner">

        <div class="section-title"><i class="fas fa-satellite-dish"></i> Aktif Sipariş</div>

        <!-- Canlı takip kartı (aktif sipariş varsa) -->
        <div class="live-card" id="live-card" style="display:none;">
            <div class="live-head">
                <span class="live-id">Sipariş #<span id="live-id">—</span></span>
                <span class="live-dot">CANLI</span>
            </div>
            <div class="track-steps">
                <div class="track-step" id="lstep-pending">
                    <div class="step-dot">🕐</div>
                    <div><div class="step-label">Sipariş Alındı</div></div>
                </div>
                <div class="track-step" id="lstep-preparing">
                    <div class="step-dot">☕</div>
                    <div><div class="step-label">Hazırlanıyor</div></div>
                </div>
                <div class="track-step" id="lstep-ready">
                    <div class="step-dot">✓</div>
                    <div><div class="step-label">Hazır! Tezgaha Gelin</div></div>
                </div>
                <div class="track-step" id="lstep-completed">
                    <div class="step-dot">🎉</div>
                    <div><div class="step-label">Teslim Edildi</div></div>
                </div>
            </div>
            <div class="live-cancelled" id="live-cancelled" style="display:none;">❌ Sipariş iptal edildi.</div>
        </div>

        <!-- Aktif sipariş yoksa -->
        <div class="live-empty" id="live-empty" style="display:none;">Şu an aktif bir siparişiniz yok.</div>

        <div class="section-title" style="margin-top:10px;"><i class="fas fa-clock-rotate-left"></i> Geçmiş Siparişler</div>
        <div id="history-list">
            <div class="hist-loading">Yükleniyor…</div>
        </div>

    </div>
</div>

<script>
// ── Tema (index.html ile aynı anahtar) ────────────────────────
function setTheme(th){ localStorage.setItem('peraTheme', th); applyTheme(th); }
function applyTheme(th){
    document.documentElement.setAttribute('data-theme', th);
    document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme === th));
}
applyTheme(localStorage.getItem('peraTheme') || 'light');

// ── Kimlik ────────────────────────────────────────────────────
const userName  = localStorage.getItem('userName')  || '';
if (!userName) { window.location.href = 'perakafe_login.html'; }
const userPhone = localStorage.getItem('userPhone') || '';

// ── Durum sözlüğü ─────────────────────────────────────────────
const STATUS = {
    pending:   { label: 'Sipariş Alındı',  cls: 'st-pending'   },
    preparing: { label: 'Hazırlanıyor',    cls: 'st-preparing' },
    ready:     { label: 'Hazır',           cls: 'st-ready'     },
    completed: { label: 'Teslim Edildi',   cls: 'st-completed' },
    cancelled: { label: 'İptal Edildi',    cls: 'st-cancelled' },
};
const TERMINAL = ['completed', 'cancelled'];

// ── Yardımcılar ───────────────────────────────────────────────
function fmtDate(s){
    if (!s) return '';
    const d = new Date(String(s).replace(' ', 'T'));   // MySQL 'YYYY-MM-DD HH:MM:SS'
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString('tr-TR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtMoney(n){ return (Number(n)||0).toFixed(2).replace('.', ',') + ' ₺'; }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// ── Canlı takip ───────────────────────────────────────────────
let liveInterval = null;
let liveId = null;

function updateSteps(status){
    const order = ['pending','preparing','ready','completed'];
    const cur   = order.indexOf(status);
    order.forEach((s, i) => {
        const el = document.getElementById('lstep-' + s);
        if (!el) return;
        el.classList.remove('done','active');
        if (i < cur)        el.classList.add('done');
        else if (i === cur) el.classList.add('active');
    });
    document.getElementById('live-cancelled').style.display = (status === 'cancelled') ? 'block' : 'none';
}

function startLive(id){
    if (liveInterval && String(id) === String(liveId)) return;   // zaten takipte
    liveId = id;
    document.getElementById('live-id').textContent = id;
    document.getElementById('live-empty').style.display = 'none';
    document.getElementById('live-card').style.display  = 'block';
    updateSteps('pending');

    const poll = async () => {
        try {
            const r = await fetch(window.location.origin + '/order/' + id + '/status');
            if (!r.ok) return;
            const data = await r.json();
            updateSteps(data.Status);
            if (TERMINAL.includes(data.Status)) {
                clearInterval(liveInterval); liveInterval = null;
                if (String(localStorage.getItem('peraActiveOrder')) === String(id)) {
                    localStorage.removeItem('peraActiveOrder');
                }
                // Son durumu kısa süre göster, sonra kartı kapatıp geçmişe indir
                setTimeout(() => { liveId = null; noLive(); loadHistory(); }, 2500);
            }
        } catch(e) {}
    };
    poll();
    if (liveInterval) clearInterval(liveInterval);
    liveInterval = setInterval(poll, 5000);
}

function noLive(){
    document.getElementById('live-card').style.display  = 'none';
    document.getElementById('live-empty').style.display = 'block';
}

// ── Geçmiş + aktif belirleme ──────────────────────────────────
async function loadHistory(){
    const list = document.getElementById('history-list');

    if (!userPhone) {
        // Misafir: telefon yok → kişiye bağlı geçmiş çekilemez (canlı takip init'te başlar)
        list.innerHTML = '<div class="hist-empty">Geçmiş siparişlerinizi görmek için telefon numaranızla giriş yapın.<br>(Misafir girişinde sipariş geçmişi tutulmaz.)</div>';
        if (!liveId) noLive();
        return;
    }

    try {
        const r = await fetch(window.location.origin + '/orders/by-phone/' + encodeURIComponent(userPhone) + '?limit=10');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const orders = await r.json();

        // Canlı takip edilen yoksa, geçmişteki en yeni "bitmemiş" siparişi canlıya al
        // (başka cihazdan verilmiş olabilir). localStorage'daki aktif sipariş önceliklidir.
        if (!liveId) {
            const act = orders.find(o => !TERMINAL.includes(o.Status));
            if (act) startLive(String(act.OrderID));
            else noLive();
        }

        // Geçmiş listesi — canlı gösterilen siparişi tekrar etme
        const past = orders.filter(o => String(o.OrderID) !== String(liveId));
        list.innerHTML = past.length
            ? past.map(renderOrderCard).join('')
            : '<div class="hist-empty">Henüz başka siparişiniz yok.</div>';
    } catch(e) {
        list.innerHTML = '<div class="hist-empty">Siparişler yüklenemedi. Lütfen tekrar deneyin.</div>';
        if (!liveId) noLive();
    }
}

function renderOrderCard(o){
    const st = STATUS[o.Status] || { label: o.Status, cls: 'st-completed' };
    const items = (o.items || []).map(it => `${it.Quantity}× ${esc(it.ProductName)}`).join(' · ') || '—';
    return `
        <div class="order-card">
            <div class="order-top">
                <span class="order-no">Sipariş #${o.OrderID}</span>
                <span class="status-badge ${st.cls}">${st.label}</span>
            </div>
            <div class="order-date">${fmtDate(o.CreatedAt)}</div>
            <div class="order-items">${items}</div>
            <div class="order-total">${fmtMoney(o.TotalAmount)}</div>
        </div>`;
}

// ── Başlat ────────────────────────────────────────────────────
(function init(){
    // Canlı takibi geçmiş fetch'inden bağımsız başlat: aktif sipariş kartı,
    // geçmiş yüklenemese bile kendi durum endpoint'ini yoklayarak görünür.
    const localActive = localStorage.getItem('peraActiveOrder');
    if (localActive) startLive(localActive);
    loadHistory();
})();
</script>

</body>
</html>
