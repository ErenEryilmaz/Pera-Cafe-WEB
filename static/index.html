<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pera Kafe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main:      #F5F1E8;
            --bg-sidebar:   #EDE0CC;
            --bg-surface:   #FFFFFF;
            --bg-card:      #FAF7F2;
            --text-main:    #3E2723;
            --text-sub:     #6D4C41;
            --text-muted:   #A1887F;
            --accent:       #4E342E;
            --accent-hover: #6D4C41;
            --border:       #D7CCC8;
            --topbar-bg:    #3E2723;
            --topbar-text:  #EFEBE9;
            --pill-bg:      rgba(62,39,35,0.88);
            --shadow:       0 4px 16px rgba(62,39,35,.12);
        }
        [data-theme="dark"] {
            --bg-main:#1A1208;--bg-sidebar:#120D05;--bg-surface:#231810;--bg-card:#2C1F14;
            --text-main:#EFEBE9;--text-sub:#BCAAA4;--text-muted:#8D6E63;
            --accent:#A1887F;--accent-hover:#BCAAA4;--border:#3E2723;
            --topbar-bg:#0D0905;--topbar-text:#EFEBE9;--pill-bg:rgba(239,235,233,0.15);
            --shadow:0 4px 16px rgba(0,0,0,.4);
        }
        [data-theme="darkblue"] {
            --bg-main:#0D1B2A;--bg-sidebar:#091422;--bg-surface:#132233;--bg-card:#1A2D3E;
            --text-main:#E8EFF5;--text-sub:#90A4AE;--text-muted:#546E7A;
            --accent:#4FC3F7;--accent-hover:#81D4FA;--border:#1E3348;
            --topbar-bg:#060F18;--topbar-text:#E8EFF5;--pill-bg:rgba(6,15,24,0.88);
            --shadow:0 4px 16px rgba(0,0,0,.5);
        }
        [data-theme="midnight"] {
            --bg-main:#111111;--bg-sidebar:#0A0A0A;--bg-surface:#1C1C1C;--bg-card:#242424;
            --text-main:#F0F0F0;--text-sub:#AAAAAA;--text-muted:#666666;
            --accent:#CF9B6E;--accent-hover:#E0B992;--border:#2E2E2E;
            --topbar-bg:#050505;--topbar-text:#F0F0F0;--pill-bg:rgba(0,0,0,.88);
            --shadow:0 4px 20px rgba(0,0,0,.6);
        }

        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg-main);color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:background .3s,color .3s}

        /* ── TOPBAR ── */
        .topbar{background:var(--topbar-bg);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:10}
        .topbar-left{display:flex;align-items:center;gap:12px}
        .av-circle{width:34px;height:34px;border-radius:50%;background:var(--accent-hover);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
        .topbar-name{color:var(--topbar-text);font-size:14px;font-weight:600}
        .topbar-brand{color:var(--topbar-text);font-size:16px;font-weight:700;letter-spacing:.5px;opacity:.9}
        .topbar-right{display:flex;align-items:center;gap:8px}
        .theme-swatches{display:flex;gap:6px;align-items:center}
        .swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s,border-color .2s}
        .swatch:hover{transform:scale(1.2)}
        .swatch.active{border-color:#fff}
        .topbar-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:5px 12px;color:var(--topbar-text);font-size:12px;font-weight:500;cursor:pointer;transition:background .2s;white-space:nowrap}
        .topbar-btn:hover{background:rgba(255,255,255,.22)}

        /* ── LAYOUT ── */
        .body-wrap{flex:1;display:flex;overflow:hidden}
        .sidebar{width:280px;flex-shrink:0;background:var(--bg-sidebar);border-right:1px solid var(--border);overflow-y:auto;padding:16px;transition:background .3s}
        .sidebar-title{font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
        .category-header{background:var(--accent);color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:8px;transition:background .2s;user-select:none}
        .category-header:hover{background:var(--accent-hover)}
        .menu-items{display:none;padding-left:8px;margin-bottom:12px}
        .menu-items.active{display:block}
        .menu-item-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;box-shadow:var(--shadow);transition:background .3s}
        .item-title{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:3px;color:var(--text-main)}
        .item-desc{font-size:11px;color:var(--text-muted)}

        /* ── CENTER ── */
        .main-container{flex:1;display:flex;padding:16px;gap:16px;overflow:hidden;min-width:0}
        .center-col{flex:2;display:flex;flex-direction:column;align-items:center;min-width:0}
        .avatar-wrap{width:100%;max-width:680px;position:relative;margin-bottom:14px}
        .avatar-frame{width:100%;height:400px;border-radius:18px;overflow:hidden;border:5px solid var(--accent);box-shadow:var(--shadow);background: url('cafebackground.png') no-repeat center center; /* <--- Kendi temiz görsel adını yaz */
    background-size: cover;}
        .avatar-frame img{width:100%;height:100%;object-fit:cover;display:block}

        /* ── VOICE PILL ── */
        .voice-pill{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--pill-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:50px;padding:7px 18px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.15);white-space:nowrap;transition:all .3s}
        .voice-pill-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .voice-pill-dot.wake   {background:#FFB74D;animation:dp 2s ease-in-out infinite}
        .voice-pill-dot.listen {background:#64B5F6;animation:dp .8s ease-in-out infinite}
        .voice-pill-dot.speak  {background:#81C784;animation:dp .5s ease-in-out infinite}
        .voice-pill-dot.process{background:#CE93D8;animation:dp 1s ease-in-out infinite}
        .voice-pill-dot.off    {background:#757575}
        @keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
        .voice-wave{display:flex;align-items:center;gap:2px;height:18px}
        .voice-wave span{display:block;width:3px;border-radius:2px;background:rgba(255,255,255,.7)}
        .voice-wave.idle span{height:3px}
        .voice-wave.active span:nth-child(1){animation:wv .7s ease-in-out infinite 0.0s}
        .voice-wave.active span:nth-child(2){animation:wv .7s ease-in-out infinite 0.1s}
        .voice-wave.active span:nth-child(3){animation:wv .7s ease-in-out infinite 0.2s}
        .voice-wave.active span:nth-child(4){animation:wv .7s ease-in-out infinite 0.1s}
        .voice-wave.active span:nth-child(5){animation:wv .7s ease-in-out infinite 0.0s}
        @keyframes wv{0%,100%{height:3px}50%{height:16px}}
        .voice-pill-text{font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
        .voice-pill-btn{background:rgba(255,255,255,.15);border:none;border-radius:20px;padding:3px 10px;color:rgba(255,255,255,.8);font-size:11px;cursor:pointer;transition:background .2s}
        .voice-pill-btn:hover{background:rgba(255,255,255,.28)}
        .voice-pill-btn.stop{background:rgba(220,50,50,.5);color:#fff}

        /* ── INPUT ── */
        .input-area{width:100%;max-width:680px;display:flex;gap:8px;margin-bottom:4px}
        .input-area input[type="text"]{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:14px;color:var(--text-main);background:var(--bg-surface);outline:none;transition:border-color .2s,background .3s,color .3s}
        .input-area input[type="text"]:focus{border-color:var(--accent)}
        .input-area input[type="text"]::placeholder{color:var(--text-muted)}
        .send-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 20px;font-weight:700;font-size:13px;cursor:pointer;transition:background .2s;white-space:nowrap}
        .send-btn:hover{background:var(--accent-hover)}
        #loading{display:none;color:var(--text-sub);font-size:12px;font-weight:600;text-align:center;margin-top:6px}

        /* ── RIGHT ── */
        .right-col{flex:1;min-width:260px;max-width:310px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
        .box-wrapper{background:var(--bg-surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:background .3s,border-color .3s}
        .box-wrapper h3{color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px;font-size:14px}
        /* Kampanya kartları */
        .campaigns-box{overflow-y:auto;max-height:230px;display:flex;flex-direction:column;gap:9px}
        .campaign-card{border-radius:10px;padding:10px 13px;border-left:4px solid #E67E22;background:var(--bg-card);transition:transform .15s,box-shadow .15s}
        .campaign-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
        .campaign-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
        .campaign-title{font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:2px}
        .campaign-desc{font-size:11px;color:var(--text-sub);line-height:1.4}
        .campaign-dates{font-size:10px;color:var(--text-muted);margin-top:4px}
        .campaign-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:16px 0}
        /* Chat mesajları artık görünmüyor ama JS kodu çalışmaya devam ediyor */
        .chat-history{display:none}
        .message{padding:8px 12px;border-radius:10px;max-width:88%;font-size:13px;line-height:1.45}
        .bot-msg{background:var(--bg-card);border:1px solid var(--border);align-self:flex-start;color:var(--text-main)}
        .user-msg{background:var(--accent);color:#fff;align-self:flex-end;border-radius:10px 10px 2px 10px}
        .receipt{max-height:260px;overflow-y:auto}
        .receipt-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;gap:6px}
        .receipt-item-name{flex:1;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .qty-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0}
        .qty-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:5px;width:22px;height:22px;cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
        .qty-btn:hover{background:var(--border)}
        .qty-num{font-size:13px;font-weight:600;color:var(--text-main);min-width:16px;text-align:center}
        .receipt-price{font-weight:700;color:var(--accent);min-width:38px;text-align:right;font-size:13px}
        .receipt-total{font-size:17px;font-weight:700;text-align:right;margin-top:10px;color:var(--text-main)}
        .reset-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:9px;border-radius:8px;margin-top:10px;cursor:pointer;font-weight:700;font-size:13px;transition:background .2s}
        .reset-btn:hover{background:var(--accent-hover)}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

        /* ══════════════════════════════════════════════
           MOBİL UYUM (#12)
        ══════════════════════════════════════════════ */

        /* Menü toggle butonu — sadece mobilde görünür */
        .menu-toggle{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;color:var(--topbar-text);cursor:pointer;font-size:16px;line-height:1}

        /* Sipariş takip modal */
        .track-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
        .track-overlay.show{display:flex}
        .track-card{background:var(--bg-surface);border:1.5px solid var(--border);border-radius:18px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.25);text-align:center}
        .track-title{font-size:17px;font-weight:700;color:var(--text-main);margin-bottom:6px}
        .track-sub{font-size:13px;color:var(--text-sub);margin-bottom:24px}
        .track-steps{display:flex;flex-direction:column;gap:0;margin-bottom:24px;text-align:left}
        .track-step{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}
        .track-step:not(:last-child)::after{content:'';position:absolute;left:14px;top:38px;width:2px;height:calc(100% - 18px);background:var(--border)}
        .track-step.done::after{background:var(--accent)}
        .step-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--bg-card);transition:all .4s;z-index:1}
        .track-step.done .step-dot{background:var(--accent);border-color:var(--accent);color:#fff}
        .track-step.active .step-dot{background:var(--bg-surface);border-color:var(--accent);color:var(--accent);animation:pulse-dot 1.4s ease-in-out infinite}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(78,52,46,.4)}50%{box-shadow:0 0 0 6px rgba(78,52,46,0)}}
        .step-label{font-size:13px;color:var(--text-sub);font-weight:500}
        .track-step.done .step-label,.track-step.active .step-label{color:var(--text-main);font-weight:600}
        .track-order-id{font-size:11px;color:var(--text-muted);margin-top:4px}
        .track-close-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 28px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s}
        .track-close-btn:hover{background:var(--accent-hover)}

        /* İndirim satırı sepette */
        .discount-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;color:#27AE60;font-weight:600}
        .discount-badge{background:rgba(39,174,96,.12);border:1px solid rgba(39,174,96,.3);border-radius:12px;padding:1px 8px;font-size:10px}

        @media (max-width: 900px) {
            .sidebar{
                position:fixed;left:0;top:52px;bottom:0;z-index:100;
                transform:translateX(-100%);transition:transform .3s;
                box-shadow:4px 0 20px rgba(0,0,0,.2);
            }
            .sidebar.open{transform:translateX(0)}
            .menu-toggle{display:block}
            .main-container{padding:10px 8px;gap:10px}
            .right-col{min-width:0;max-width:none}
            .avatar-frame{height:260px}
        }
        @media (max-width:680px){
            .topbar{padding:0 12px;height:48px}
            .topbar-brand{display:none}
            .theme-swatches{gap:4px}
            .swatch{width:18px;height:18px}
            .main-container{flex-direction:column;overflow-y:auto;padding:8px}
            .center-col{min-width:0;width:100%}
            .right-col{width:100%;max-width:none;flex-direction:row;flex-wrap:wrap;gap:10px;overflow:visible}
            .right-col .box-wrapper{flex:1;min-width:260px}
            .avatar-wrap{margin-bottom:10px}
            .avatar-frame{height:220px;border-radius:12px;border-width:3px}
            .voice-pill{padding:5px 12px;gap:7px}
            .voice-pill-text{font-size:11px}
            .input-area{gap:6px}
            .input-area input[type="text"]{padding:10px 12px;font-size:13px}
            .send-btn{padding:0 14px;font-size:12px}
            .campaigns-box{max-height:160px}
            .receipt{max-height:180px}
        }
        @media (max-width:400px){
            .right-col{flex-direction:column}
            .right-col .box-wrapper{min-width:0}
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()" title="Menü">☰</button>
        <div class="av-circle" id="av-circle">?</div>
        <span class="topbar-name" id="topbar-name">—</span>
        <span class="topbar-brand" style="margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)">☕ Pera Kafe</span>
    </div>
    <div class="topbar-right">
        <div class="theme-swatches">
            <div class="swatch active" style="background:#F5F1E8" data-theme="light"    onclick="setTheme('light')"></div>
            <div class="swatch"        style="background:#1A1208" data-theme="dark"     onclick="setTheme('dark')"></div>
            <div class="swatch"        style="background:#0D1B2A" data-theme="darkblue" onclick="setTheme('darkblue')"></div>
            <div class="swatch"        style="background:#1B1B1B" data-theme="midnight" onclick="setTheme('midnight')"></div>
        </div>
        <button class="topbar-btn" id="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> <span id="txt-logout"></span>
        </button>
    </div>
</div>

<!-- GÖVDE -->
<div class="body-wrap">
    <div class="sidebar">
        <div class="sidebar-title" id="txt-menu-title">—</div>
        <div id="menu-container"><p style="text-align:center;color:var(--text-muted);font-size:13px;" id="txt-loading-menu">—</p></div>
    </div>

    <div class="main-container">
        <div class="center-col">

            <div class="avatar-wrap">
                <div class="avatar-frame" id="model-container"> 
                    </div>
                <div class="voice-pill" id="voice-pill">
                    <div class="voice-pill-dot wake" id="pill-dot"></div>
                    <div class="voice-wave idle" id="pill-wave">
                        <span style="height:4px"></span><span style="height:10px"></span>
                        <span style="height:6px"></span><span style="height:14px"></span>
                        <span style="height:5px"></span>
                    </div>
                    <span class="voice-pill-text" id="pill-text">—</span>
                    <button class="voice-pill-btn" id="pill-btn" onclick="toggleVoiceSystem()">—</button>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="—" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> <span id="txt-send">—</span>
                </button>
            </div>
            <div id="loading">—</div>

        </div>

        <div class="right-col">
            <!-- Kampanya kartları (chat geçmişinin yerini aldı) -->
            <div class="box-wrapper">
                <h3 id="txt-campaigns-title">🎁 Kampanyalar</h3>
                <div class="campaigns-box" id="campaigns-container">
                    <div class="campaign-empty">Yükleniyor...</div>
                </div>
            </div>
            <!-- Chat history gizli ama JS için kalıyor -->
            <div class="chat-history" id="chat-history" style="display:none"></div>
            <div class="box-wrapper">
                <h3 id="txt-receipt-title">—</h3>
                <div class="receipt" id="receipt-container"></div>
                <div id="receipt-summary"></div>
                <button class="reset-btn" id="btn-pay" onclick="clearCart()">—</button>
            </div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  ÇEVİRİLER — tüm arayüz metinleri
// ══════════════════════════════════════════════════════════
const UI = {
    tr: {
        dir:            'ltr',
        htmlLang:       'tr',
        logout:         'Çıkış',
        menuTitle:      '📜 Menü',
        menuLoading:    'Yükleniyor...',
        menuFailed:     'Menü yüklenemedi.',
        chatTitle:      '💬 Son Konuşmalar',
        receiptTitle:   '🧾 Adisyon',
        cartEmpty:      'Sepetiniz boş.',
        btnPay:         'Sipariş Ver 🛎️',
        total:          'Toplam',
        inputPlaceholder:'Veya buraya yazın...',
        btnSend:        'Gönder',
        loading:        'Pera düşünüyor...',
        pillWake:       '"Pera" diyerek başlayın',
        pillListen:     'Dinliyorum...',
        pillProcess:    'Düşünüyor...',
        pillSpeak:      'Pera konuşuyor...',
        pillOff:        'Sesli sistem kapalı',
        pillStart:      'Başlat',
        pillStop:       'Durdur',
        greeting:       (name) => `Hoş geldin ${name}! Pera Kafe'ye yeniden bekliyorduk, ne alırdın?`,
        errServer:      '⚠️ Garson şu an yanıt veremiyor.',
        wakeWords:      ['pera','pera kafe','hey pera','merhaba pera'],
        speechLang:     'tr-TR',
        cold:           '🧊 Soğuk',
        hot:            '☕ Sıcak',
    },
    en: {
        dir:            'ltr',
        htmlLang:       'en',
        logout:         'Sign out',
        menuTitle:      '📜 Menu',
        menuLoading:    'Loading...',
        menuFailed:     'Could not load menu.',
        chatTitle:      '💬 Recent Chats',

// ══════════════════════════════════════════════════════════
//  SES TANIMA — İKİ AŞAMALI (wake → command)
//
//  Mimari:
//  • Her recognition.start() çağrısı TEK bir oturum açar.
//  • onend her zaman tetiklenir (sonuç gelse de gelmese de).
//  • gotResult bayrağı: onend'in "boş kapanma" mı yoksa
//    "sonuç geldi, biz kapattık" mı olduğunu ayırt eder.
//  • commandPending: wake word yakalandı, komut bekleniyor.
// ══════════════════════════════════════════════════════════

// Her startSR() çağrısına benzersiz id — eski onend/onerror'ları filtreler
let srId           = 0;
let commandPending = false;

function killSR() {
    if (!recognition) return;
    const old = recognition;
    recognition  = null;
    old.onresult = null;
    old.onerror  = null;
    old.onend    = null;
    try { old.abort(); } catch(e) {}
}

function startSR() {
    if (!voiceEnabled) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setPill('off'); return; }

    killSR();

    const myId = ++srId;
    const sr   = new SR();
    sr.lang           = t.speechLang;
    sr.continuous     = false;
    sr.interimResults = false;
    recognition = sr;

    sr.onresult = (e) => {
        if (myId !== srId) return;
        srId++;                             // bu oturumu kapat; onend artık restart yapmaz
        const tx = e.results[0][0].transcript.toLowerCase().trim();
        handleTranscript(tx);
    };

    sr.onerror = (e) => {
        if (myId !== srId) return;
        if (e.error === 'not-allowed') {
            voiceEnabled = false; setPill('off'); updatePillText(); return;
        }
        if (e.error === 'aborted') return;
        // no-speech, network → kısa bekleyip tekrar dene
        setTimeout(() => { if (voiceEnabled && myId === srId) startSR(); }, 400);
    };

    sr.onend = () => {
        if (myId !== srId) return;          // onresult zaten srId'yi artırdı → bu tetiklenmez
        // Sessizlik / erken kapanma → aynı fazda devam et
        setTimeout(() => { if (voiceEnabled && myId === srId) startSR(); }, 150);
    };

    try { sr.start(); } catch(e) {
        setTimeout(() => { if (voiceEnabled) startSR(); }, 500);
    }
}

function handleTranscript(tx) {
    if (commandPending) {
        commandPending = false;
        if (tx.length > 1) {
            sendMessage(tx);                // AI akışı resume'ı yönetir
        } else {
            setPill('wake');
            setTimeout(() => { if (voiceEnabled) startSR(); }, 300);
        }
    } else {
        if (t.wakeWords.some(w => tx.includes(w))) {
            playBeep();
            commandPending = true;
            setPill('listen');
            setTimeout(() => { if (voiceEnabled) startSR(); }, 500);
        } else {
            setTimeout(() => { if (voiceEnabled) startSR(); }, 100);
        }
    }
}

function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setPill('off'); updatePillText(); }
}

function startVoiceSystem() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setPill('off'); updatePillText(); return; }
    voiceEnabled   = true;
    commandPending = false;
    setPill('wake');
    updatePillText();
    startSR();
}

function stopVoiceSystem() {
    voiceEnabled   = false;
    commandPending = false;
    srId++;                                 // geçmiş tüm oturumları iptal et
    killSR();
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    setPill('off');
    updatePillText();
}

function toggleVoiceSystem() { voiceEnabled ? stopVoiceSystem() : startVoiceSystem(); }

function setPill(mode) {
    voiceMode = mode;
    const textMap = { wake:t.pillWake, listen:t.pillListen, process:t.pillProcess, speaking:t.pillSpeak, off:t.pillOff };
    document.getElementById('pill-text').textContent = textMap[mode] || t.pillWake;
    document.getElementById('pill-dot').className    = 'voice-pill-dot ' + mode;
    const wave = document.getElementById('pill-wave');
    wave.className = 'voice-wave ' + (['listen','speaking'].includes(mode) ? 'active' : 'idle');
    updatePillText();
}

// ══════════════════════════════════════════════════════════
//  BEEP
// ══════════════════════════════════════════════════════════
function playBeep() {
    try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.start(); osc.stop(ctx.currentTime + 0.22);
    } catch(e) {}
}

// ══════════════════════════════════════════════════════════
//  MESAJ GÖNDER
// ══════════════════════════════════════════════════════════
async function sendMessage(textOverride = null) {
    const field = document.getElementById('user-input');
    const msg   = textOverride || field.value.trim();
    if (!msg) return;

    field.value = '';
    appendMessage('user', msg);
    chatMessages.push({ role:'user', content:msg });
    document.getElementById('loading').style.display = 'block';

    // Mevcut SR oturumunu geçersiz kıl, yeni başlatana kadar durdur
    commandPending = false;
    srId++;
    killSR();
    setPill('process');

    try {
        const res = await fetch(window.location.origin+'/chat', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ messages: chatMessages, user_name: userName, lang: currentLang })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.reply) {
            appendMessage('assistant', data.reply);
            chatMessages.push({ role:'assistant', content:data.reply });
        }
        if (data.cart != null) mergeCart(data.cart);

        if (data.audio_base64) {
            setPill('speaking');
            playAudioAndResume(data.audio_base64);
        } else {
            resumeWakeWord(500);
        }

    } catch(err) {
        console.error(err);
        appendMessage('assistant', t.errServer);
        chatMessages.pop();
        resumeWakeWord(1000);
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

// ══════════════════════════════════════════════════════════
//  SES ÇALMA
// ══════════════════════════════════════════════════════════
function playAudioAndResume(b64) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    currentAudio = new Audio('data:audio/mp3;base64,' + b64);
    
    // SES BAŞLADIĞINDA: Ağız hareketini başlat
    currentAudio.onplay = () => { window.isPeraSpeaking = true; }; 

    // SES BİTTİĞİNDE VEYA HATA VERDİĞİNDE: Ağız hareketini durdur
    currentAudio.onended = currentAudio.onerror = () => { 
        window.isPeraSpeaking = false; 
        currentAudio = null; 
        resumeWakeWord(400); 
    };
    
    currentAudio.play().catch(() => {
        window.isPeraSpeaking = false; // Hata olursa çeneyi kapat
        resumeWakeWord(400);
    });
}

function resumeWakeWord(delay) {
    if (!voiceEnabled) return;
    setTimeout(() => {
        if (!voiceEnabled) return;
        commandPending = false;
        setPill('wake');
        startSR();
    }, delay);
}


// ══════════════════════════════════════════════════════════
//  SEPET — Kampanya İndirim Uygulaması (#4)
// ══════════════════════════════════════════════════════════
function mergeCart(aiCart) {
    const grouped = {};
    aiCart.forEach(item => {
        const key = item.ad;
        if (!grouped[key]) grouped[key] = { ad:item.ad, fiyat:item.fiyat, qty:0 };
        grouped[key].qty++;
    });
    cart = Object.values(grouped);
    renderCart();
}

function changeQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) cart.splice(index, 1);
    renderCart();
}

// Aktif kampanyaları sepete uygular; indirim detaylarını döner
function applyDiscounts(cartItems, campaigns) {
    let discounts = []; // [{label, amount}]
    let freeItems = {}; // hangi ürünlerde kaç bedava

    campaigns.forEach(camp => {
        if (!camp) return;
        if (camp.type === 'buy_x_get_y') {
            const buy = camp.config.buy || 2;
            const get = camp.config.get || 1;
            cartItems.forEach(item => {
                const sets      = Math.floor(item.qty / (buy + get));
                const remainder = item.qty % (buy + get);
                const freeCount = sets * get + (remainder > buy ? remainder - buy : 0);
                if (freeCount > 0) {
                    const saving = freeCount * item.fiyat;
                    discounts.push({ label: `${camp.title} — ${item.ad} (${freeCount} bedava)`, amount: saving });
                    freeItems[item.ad] = (freeItems[item.ad] || 0) + freeCount;
                }
            });
        } else if (camp.type === 'percentage') {
            const rawTotal = cartItems.reduce((s,i)=>s+i.fiyat*i.qty, 0);
            const saving   = rawTotal * (camp.config.percent / 100);
            if (saving > 0) discounts.push({ label: `${camp.title} (%${camp.config.percent})`, amount: saving });
        } else if (camp.type === 'fixed') {
            const rawTotal = cartItems.reduce((s,i)=>s+i.fiyat*i.qty, 0);
            const saving   = Math.min(camp.config.amount, rawTotal);
            if (saving > 0) discounts.push({ label: `${camp.title} (-${camp.config.amount}₺)`, amount: saving });
        }
    });

    return discounts;
}

function renderCart() {
    const container = document.getElementById('receipt-container');
    const summary   = document.getElementById('receipt-summary');
    container.innerHTML = '';

    if (!cart.length) {
        container.innerHTML = `<p style="color:var(--text-muted);text-align:center;font-size:13px;">${t.cartEmpty}</p>`;
        summary.innerHTML = '';
        return;
    }

    let rawTotal = 0;
    cart.forEach((item, i) => {
        const rowTotal = item.fiyat * item.qty;
        rawTotal += rowTotal;
        const row = document.createElement('div');
        row.className = 'receipt-item';
        row.innerHTML = `
            <span class="receipt-item-name">${item.ad}</span>
            <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${i},+1)">+</button>
            </div>
            <span class="receipt-price">${rowTotal}₺</span>`;
        container.appendChild(row);
    });

    // Kampanya indirimleri
    const activeCamps = window._activeCampaigns || [];
    const discounts   = applyDiscounts(cart, activeCamps);
    let totalDiscount = 0;

    discounts.forEach(d => {
        totalDiscount += d.amount;
        const row = document.createElement('div');
        row.className = 'discount-row';
        row.innerHTML = `
            <span>🎁 ${d.label}</span>
            <span class="discount-badge">-${d.amount.toFixed(2)}₺</span>`;
        container.appendChild(row);
    });

    const finalTotal = Math.max(0, rawTotal - totalDiscount);
    let summaryHtml = '';
    if (totalDiscount > 0) {
        summaryHtml += `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);margin-top:8px">
            <span>Ara Toplam</span><span>${rawTotal.toFixed(2)} ₺</span></div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#27AE60;font-weight:600">
            <span>İndirim</span><span>-${totalDiscount.toFixed(2)} ₺</span></div>`;
    }
    summaryHtml += `<div class="receipt-total">${t.total}: ${finalTotal.toFixed(2)} ₺</div>`;

    // Ödeme butonu ile sipariş gönder
    summary.innerHTML = summaryHtml;
    document.getElementById('btn-pay').onclick = () => placeOrder(finalTotal);
}

function clearCart() { cart = []; renderCart(); }

// ══════════════════════════════════════════════════════════
//  SİPARİŞ GÖNDER + TAKİP (#5)
// ══════════════════════════════════════════════════════════
let trackingInterval = null;

async function placeOrder(finalTotal) {
    if (!cart.length) return;

    const memberPhone = localStorage.getItem('userPhone') || null;
    const items = cart.map(i => ({ name:i.ad, qty:i.qty, price:i.fiyat }));

    try {
        const r = await fetch(window.location.origin + '/order', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ table_no:'Kiosk', member_phone:memberPhone, items, notes:null })
        });
        if (!r.ok) {
            const err = await r.json();
            appendMessage('assistant', '⚠️ ' + (err.detail || 'Sipariş gönderilemedi.'));
            return;
        }
        const data = await r.json();
        cart = [];
        renderCart();
        startOrderTracking(data.order_id);
    } catch(e) {
        appendMessage('assistant', '⚠️ Sipariş gönderilemedi: ' + e.message);
    }
}

function startOrderTracking(orderId) {
    document.getElementById('track-order-id').textContent = orderId;
    document.getElementById('track-overlay').classList.add('show');
    updateTrackSteps('pending');

    if (trackingInterval) clearInterval(trackingInterval);
    trackingInterval = setInterval(async () => {
        try {
            const r = await fetch(window.location.origin + '/order/' + orderId + '/status');
            if (!r.ok) return;
            const data = await r.json();
            updateTrackSteps(data.Status);
            if (data.Status === 'completed' || data.Status === 'cancelled') {
                clearInterval(trackingInterval);
                trackingInterval = null;
            }
        } catch(e) {}
    }, 5000); // 5 saniyede bir kontrol
}

function updateTrackSteps(status) {
    const order = ['pending','preparing','ready','completed'];
    const cur   = order.indexOf(status);
    order.forEach((s, i) => {
        const el = document.getElementById('step-' + s);
        if (!el) return;
        el.classList.remove('done','active');
        if (i < cur)       el.classList.add('done');
        else if (i === cur) el.classList.add('active');
    });
    if (status === 'cancelled') {
        document.getElementById('track-sub').textContent = '❌ Sipariş iptal edildi.';
    }
}

function closeOrderTracking() {
    document.getElementById('track-overlay').classList.remove('show');
    if (trackingInterval) { clearInterval(trackingInterval); trackingInterval = null; }
}

// Kampanyaları global olarak sakla (discount hesabı için)
async function fetchCampaigns() {
    try {
        const r = await fetch(window.location.origin + '/campaigns');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        window._activeCampaigns = await r.json();
        renderCampaigns(window._activeCampaigns);
    } catch(e) {
        const box = document.getElementById('campaigns-container');
        if (box) box.innerHTML = '<div class="campaign-empty">Kampanyalar yüklenemedi.</div>';
        window._activeCampaigns = [];
    }
}

function appendMessage(role, text) {
    const box = document.getElementById('chat-history');
    const el  = document.createElement('div');
    el.className  = 'message ' + (role === 'user' ? 'user-msg' : 'bot-msg');
    el.textContent = text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    while (box.children.length > 20) box.removeChild(box.firstChild);
}

//  MENÜ — sıcak/soğuk etiketi dile göre
// ══════════════════════════════════════════════════════════
async function fetchMenu() {
    try {
        const r = await fetch(window.location.origin+'/menu');
        const d = await r.json();
        renderMenu(d.menu);
    } catch(e) {
        document.getElementById('menu-container').innerHTML =
            `<p style="color:red;font-size:12px;">${t.menuFailed}</p>`;
    }
}

function renderMenu(menuDb) {
    const cont = document.getElementById('menu-container');
    cont.innerHTML = '';
    for (const [kategori, urunler] of Object.entries(menuDb)) {
        const header = document.createElement('div');
        header.className  = 'category-header';
        header.innerText  = kategori + ' ▾';

        const list = document.createElement('div');
        list.className = 'menu-items';

        urunler.forEach(item => {
            // Sıcaklık etiketini dile göre çevir
            const sicaklik = item.fiyat_gorunum.includes('Cold') || item.fiyat_gorunum.includes('Soğuk') || item.fiyat_gorunum.includes('بارد')
                ? t.cold : t.hot;
            list.innerHTML += `
                <div class="menu-item-card">
                    <div class="item-title">
                        <span>${item.urun}</span>
                        <span>${item.taban_fiyat}₺</span>
                    </div>
                    <div class="item-desc">${sicaklik}</div>
                </div>`;
        });

        header.onclick = () => {
            document.querySelector('.sidebar').classList.remove('open');
            const open = list.classList.contains('active');
            document.querySelectorAll('.menu-items').forEach(el => el.classList.remove('active'));
            if (!open) list.classList.add('active');
        };

        cont.appendChild(header);
        cont.appendChild(list);
    }
    const first = cont.querySelector('.menu-items');
    if (first) first.classList.add('active');
}

// fetchCampaigns yeni versiyona taşındı

function renderCampaigns(list) {
    const box = document.getElementById('campaigns-container');
    if (!box) return;
    if (!list || !list.length) {
        box.innerHTML = '<div class="campaign-empty">Şu an aktif kampanya yok.</div>';
        return;
    }
    box.innerHTML = list.map(c => {
        const labels = {
            buy_x_get_y: `${c.config.buy} ALANA ${c.config.get} BEDAVA`,
            percentage:  `%${c.config.percent} İNDİRİM`,
            fixed:       `${c.config.amount}₺ İNDİRİM`,
        };
        const badgeText = labels[c.type] || c.type.toUpperCase();
        const color     = c.badge_color || '#E67E22';
        const dates     = (c.start_date || c.end_date)
            ? `<div class="campaign-dates">📅 ${c.start_date||'—'} → ${c.end_date||'—'}</div>` : '';
        return `<div class="campaign-card" style="border-left-color:${color}">
            <span class="campaign-badge" style="background:${color}">${badgeText}</span>
            <div class="campaign-title">${c.title}</div>
            ${c.description ? `<div class="campaign-desc">${c.description}</div>` : ''}
            ${dates}
        </div>`;
    }).join('');
}

function checkLangChange() {

    if (stored !== currentLang) {
        currentLang = stored;
        // Sohbeti sıfırla ki karşılama yeni dilde gelsin
        chatMessages = [];
        document.getElementById('chat-history').innerHTML = '';
        applyLang();
    }
}

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('model-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.set(0, 1.5, 3); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor( 0x000000, 0 ); 
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(2, 2, 5);
    scene.add(directionalLight);

    // YENİ: Yüz mesh'ini ve ağız animasyonunu hafızada tutacak değişkenler
    // YENİ: Yüz mesh'ini ve ağız animasyonunu hafızada tutacak değişkenler
    let faceMesh = null;
    let mouthOpenIndex = 42; // NUMARAYI BURAYA SABİTLEDİK!

    const loader = new GLTFLoader();
    loader.load(
        'parkergirl.glb', // Senin model dosyanın adı
        function (gltf) {
            const model = gltf.scene;
            model.position.set(0, 0.2, 2.5); 
            scene.add(model);
            
            // Sahnedeki yüz parçasını (object_16) buluyoruz
            model.traverse((child) => {
                // Eğer parçanın adı senin bulduğun ad ise
                if (child.isMesh && child.name === 'Object_16') {
                    faceMesh = child;
                    console.log("Hedef yüz bulundu ve 42 numaralı kas bağlandı!");
                }
            });
        },
        undefined,
        function (error) { console.error('Hata:', error); }
    );

    // 5. Animasyon Döngüsü
    function animate() {
        requestAnimationFrame(animate);

        // YENİ: Konuşma animasyonu (Kuklacılık)
        if (faceMesh && mouthOpenIndex !== -1) {
            if (window.isPeraSpeaking) {
                // Zamanı kullanarak rastgele gibi görünen hızlı bir çene hareketi yarat (Sinüs dalgası)
                const hiz = Date.now() * 0.015; // Hız çarpanı (Konuşma hızını değiştirir)
                const aciklik = (Math.sin(hiz) + 1) / 2; // 0 ile 1 arasında sürekli inip çıkan bir değer
                
                // Ağzı maksimum %70 (0.7) oranında aç ki çok abartı durmasın
                faceMesh.morphTargetInfluences[mouthOpenIndex] = aciklik * 0.7; 
            } else {
                // Konuşmuyorsa ağzı yumuşakça (lerp ile) kapat
                faceMesh.morphTargetInfluences[mouthOpenIndex] += (0 - faceMesh.morphTargetInfluences[mouthOpenIndex]) * 0.2;
            }
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        const newWidth = container.clientWidth;
        const newHeight = container.clientHeight;
        camera.aspect = newWidth / newHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(newWidth, newHeight);
    });
</script>
