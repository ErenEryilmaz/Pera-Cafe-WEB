<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pera Kafe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="perakafe.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()" title="Menü">☰</button>
        <div class="av-circle" id="av-circle">?</div>
        <span class="topbar-name" id="topbar-name">—</span>
        <span class="topbar-brand" style="margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)">☕ Pera Kafe</span>
    </div>
    <div class="topbar-right">
        <div class="theme-swatches">
            <div class="swatch active" style="background:#F5F1E8" data-theme="light"    onclick="setTheme('light')"></div>
            <div class="swatch"        style="background:#1A1208" data-theme="dark"     onclick="setTheme('dark')"></div>
            <div class="swatch"        style="background:#0D1B2A" data-theme="darkblue" onclick="setTheme('darkblue')"></div>
            <div class="swatch"        style="background:#1B1B1B" data-theme="midnight" onclick="setTheme('midnight')"></div>
        </div>
        <button class="topbar-btn" id="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> <span id="txt-logout"></span>
        </button>
    </div>
</div>

<!-- GÖVDE -->
<div class="body-wrap">
    <div class="sidebar">
        <div class="sidebar-title" id="txt-menu-title">—</div>
        <div id="menu-container">
            <p style="text-align:center;color:var(--text-muted);font-size:13px;" id="txt-loading-menu">—</p>
        </div>
    </div>

    <div class="main-container">
        <div class="center-col">
            <div class="avatar-wrap">
                <div class="avatar-frame" id="model-container">
                    <!-- Model seçici - cafe görseli üzerinde -->
                    <div class="model-switcher-overlay">
                        <button class="model-switch-btn active" data-model="parkergirl" onclick="switchModel('parkergirl')" title="Kadın">
                            <span class="model-btn-icon">♀</span>
                            <span class="model-btn-label">Kadın</span>
                        </button>
                        <button class="model-switch-btn" data-model="male_model" onclick="switchModel('male_model')" title="Erkek">
                            <span class="model-btn-icon">♂</span>
                            <span class="model-btn-label">Erkek</span>
                        </button>
                    </div>
                </div>
                <div class="voice-pill" id="voice-pill">
                    <div class="voice-pill-dot wake" id="pill-dot"></div>
                    <div class="voice-wave idle" id="pill-wave">
                        <span style="height:4px"></span><span style="height:10px"></span>
                        <span style="height:6px"></span><span style="height:14px"></span>
                        <span style="height:5px"></span>
                    </div>
                    <span class="voice-pill-text" id="pill-text">—</span>
                    <button class="voice-pill-btn" id="pill-btn" onclick="toggleVoiceSystem()">—</button>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="—" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> <span id="txt-send">—</span>
                </button>
            </div>
            <div id="loading">—</div>
        </div>

        <div class="right-col">
            <div class="box-wrapper">
                <h3 id="txt-campaigns-title">🎁 Kampanyalar</h3>
                <div class="campaigns-box" id="campaigns-container">
                    <div class="campaign-empty">Yükleniyor...</div>
                </div>
            </div>
            <div class="chat-history" id="chat-history" style="display:none"></div>
            <div class="box-wrapper">
                <h3 id="txt-receipt-title">—</h3>
                <div class="receipt" id="receipt-container"></div>
                <div id="receipt-summary"></div>
                <button class="reset-btn" id="btn-pay" onclick="clearCart()">—</button>
            </div>
        </div>
    </div>
</div>

<!-- SİPARİŞ TAKİP MODAL -->
<div class="track-overlay" id="track-overlay">
    <div class="track-card">
        <div class="track-title">📦 Siparişiniz Takip Ediliyor</div>
        <div class="track-sub" id="track-sub">Sipariş #<span id="track-order-id">—</span></div>
        <div class="track-steps">
            <div class="track-step" id="step-pending">
                <div class="step-dot">🕐</div>
                <div><div class="step-label">Sipariş Alındı</div></div>
            </div>
            <div class="track-step" id="step-preparing">
                <div class="step-dot">☕</div>
                <div><div class="step-label">Hazırlanıyor</div></div>
            </div>
            <div class="track-step" id="step-ready">
                <div class="step-dot">✓</div>
                <div><div class="step-label">Hazır! Tezgaha Gelin</div></div>
            </div>
            <div class="track-step" id="step-completed">
                <div class="step-dot">🎉</div>
                <div><div class="step-label">Teslim Edildi</div></div>
            </div>
        </div>
        <button class="track-close-btn" onclick="closeOrderTracking()">Kapat</button>
    </div>
</div>

<!-- JS: sıra önemli! ui-strings önce yüklenmeli -->
<script src="js/ui-strings.js"></script>
<script src="js/voice.js"></script>
<script src="js/cart.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>

<!-- 3D Model (module tip; ayrı kalmalı) -->
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader }   from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader }  from 'three/addons/loaders/DRACOLoader.js';

    // ── MODEL TANIMI ──────────────────────────────────────────────
    // Yeni model eklemek için buraya bir obje daha ekle.
    // faceMeshName : model içindeki yüz mesh'inin adı (konsoldan bulunur)
    // kaslar       : morph target isim + çarpan listesi (isim → index otomatik çevrilir)
    // modelPos     : sahne içi konum (x, y, z)
    // cameraPos    : kamera konumu (x, y, z)
    const MODEL_CONFIG = {
        parkergirl: {
            dosya:        '/static/parkergirl.glb',
            faceMeshName: 'Object_16',
            modelPos:     { x: 0,   y: 0.2, z: 2.5 },
            cameraPos:    { x: 0,   y: 0,   z: 5   },
            kaslar: [
                { index: 42, carpan: 0.8 },
                { index: 41, carpan: 0.3 },
                { index: 43, carpan: 0.5 },
            ],
        },
        male_model: {
            dosya:        '/static/male_model-v1.glb',
            faceMeshName: 'CC_Base_Body_1',
            modelPos:     { x: 0,   y: 0,   z: 0   },
            cameraPos:    { x: 0,   y: 0,   z: 5   },
            kaslar: [
                { isim: 'Mouth_Pucker_Open', carpan: 0.8 },
                { isim: 'Mouth_Widen_Sides', carpan: 0.4 },
            ],
        },
    };

    // ── SAHNE KURULUMU ────────────────────────────────────────────
    const container = document.getElementById('model-container');

    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(2, 2, 5);
    scene.add(dirLight);

    // ── DURUM ─────────────────────────────────────────────────────
    let faceMesh       = null;
    let aktifKaslar    = [];
    let aktifModel     = null;
    let aktifKey       = null;

    // Cache: yüklenmiş gltf'leri sakla — tekrar indirme
    const gltfCache = {};

    // ── SPINNER ───────────────────────────────────────────────────
    const spinner = document.createElement('div');
    spinner.id = 'model-spinner';
    container.appendChild(spinner);

    function showSpinner() { spinner.style.display = 'block'; }
    function hideSpinner() { spinner.style.display = 'none';  }

    // ── MORPH TARGET BAĞLA ────────────────────────────────────────
    function bindMorphTargets(key, model) {
        const cfg = MODEL_CONFIG[key];
        faceMesh    = null;
        aktifKaslar = [];

        model.traverse((child) => {
            if (child.isMesh) {
                const dict = child.morphTargetDictionary || {};
                console.log(`[${key}] Mesh: "${child.name}" | morphTargets:`,
                    Object.keys(dict).length ? dict : 'yok');

                if (cfg.faceMeshName && child.name === cfg.faceMeshName) {
                    faceMesh = child;
                    aktifKaslar = cfg.kaslar.flatMap(kas => {
                        if (typeof kas.index === 'number') return [{ index: kas.index, carpan: kas.carpan }];
                        const idx = dict[kas.isim];
                        if (idx === undefined) {
                            console.warn(`[${key}] Morph target bulunamadı: "${kas.isim}"`);
                            return [];
                        }
                        return [{ index: idx, carpan: kas.carpan }];
                    });
                    console.log(`[${key}] Yüz mesh bağlandı, aktif kaslar:`, aktifKaslar);
                }
            }
        });
    }

    // ── MODEL YÜKLE (cache'li) ────────────────────────────────────
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
    dracoLoader.preload();

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    function loadGLTF(key) {
        return new Promise((resolve, reject) => {
            if (gltfCache[key]) { resolve(gltfCache[key]); return; }
            loader.load(MODEL_CONFIG[key].dosya,
                gltf => { gltfCache[key] = gltf; resolve(gltf); },
                undefined,
                reject
            );
        });
    }

    function switchToModel(key) {
        const cfg = MODEL_CONFIG[key];
        if (!cfg || key === aktifKey) return;

        showSpinner();

        // Önceki modeli sahneden kaldır (ama cache'den değil)
        if (aktifModel) { scene.remove(aktifModel); aktifModel = null; }
        faceMesh = null; aktifKaslar = [];

        camera.position.set(cfg.cameraPos.x, cfg.cameraPos.y, cfg.cameraPos.z);

        loadGLTF(key).then(gltf => {
            // Cache'den gelen sahneyi klonla — aynı gltf'yi birden kullanabilmek için
            const model = gltf.scene.clone(true);
            model.position.set(cfg.modelPos.x, cfg.modelPos.y, cfg.modelPos.z);
            if (cfg.modelRot) model.rotation.set(cfg.modelRot.x ?? 0, cfg.modelRot.y ?? 0, cfg.modelRot.z ?? 0);
            scene.add(model);
            aktifModel = model;
            aktifKey   = key;

            bindMorphTargets(key, model);
            hideSpinner();

            document.querySelectorAll('.model-switch-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.model === key);
            });
            localStorage.setItem('peraModel', key);
        }).catch(err => {
            console.error(`[${key}] Model yükleme hatası:`, err);
            hideSpinner();
        });
    }

    // ── ARKA PLANDA ÖNCEDEN YÜKLE ─────────────────────────────────
    // Aktif olmayan modeli sessizce indirerek cache'e al
    function preloadDiger(aktifKey) {
        Object.keys(MODEL_CONFIG).forEach(key => {
            if (key !== aktifKey) {
                loadGLTF(key)
                    .then(() => console.log(`[preload] ${key} cache'e alındı.`))
                    .catch(() => {});
            }
        });
    }

    // window'a aç — butonlar erişsin
    window.switchModel = (key) => switchToModel(key);

    // ── BOYUT ─────────────────────────────────────────────────────
    function resizeRenderer() {
        const w = container.clientWidth  || container.offsetWidth  || 400;
        const h = container.clientHeight || container.offsetHeight || 400;
        if (w === 0 || h === 0) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    // ResizeObserver: container boyutu her değiştiğinde güncelle
    if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(resizeRenderer).observe(container);
    } else {
        window.addEventListener('resize', resizeRenderer);
    }
    requestAnimationFrame(resizeRenderer);

    // ── ANİMASYON DÖNGÜSÜ ─────────────────────────────────────────
    function animate() {
        requestAnimationFrame(animate);

        if (faceMesh && aktifKaslar.length) {
            if (window.isPeraSpeaking) {
                const temelRitm = (Math.sin(Date.now() * 0.015) + 1) / 2;
                aktifKaslar.forEach(kas => {
                    faceMesh.morphTargetInfluences[kas.index] = temelRitm * kas.carpan;
                });
            } else {
                aktifKaslar.forEach(kas => {
                    faceMesh.morphTargetInfluences[kas.index] +=
                        (0 - faceMesh.morphTargetInfluences[kas.index]) * 0.2;
                });
            }
        }

        renderer.render(scene, camera);
    }
    animate();

    // ── İLK YÜKLEME ───────────────────────────────────────────────
    const baslangicModel = localStorage.getItem('peraModel') || 'parkergirl';
    switchToModel(baslangicModel);

    // İlk model yüklendikten sonra diğerini arka planda indir
    setTimeout(() => preloadDiger(baslangicModel), 3000);
</script>

</body>
</html>
