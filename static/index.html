<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pera Kafe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="perakafe.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button class="menu-toggle" onclick="toggleSidebar()" title="Menü">☰</button>
        <div class="av-circle" id="av-circle">?</div>
        <span class="topbar-name" id="topbar-name">—</span>
        <span class="topbar-brand" style="margin-left:12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)">☕ Pera Kafe</span>
    </div>
    <div class="topbar-right">
        <div class="theme-swatches">
            <div class="swatch active" style="background:#F5F1E8" data-theme="light"    onclick="setTheme('light')"></div>
            <div class="swatch"        style="background:#1A1208" data-theme="dark"     onclick="setTheme('dark')"></div>
            <div class="swatch"        style="background:#0D1B2A" data-theme="darkblue" onclick="setTheme('darkblue')"></div>
            <div class="swatch"        style="background:#1B1B1B" data-theme="midnight" onclick="setTheme('midnight')"></div>
        </div>
        <button class="topbar-btn" id="btn-logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> <span id="txt-logout"></span>
        </button>
    </div>
</div>

<!-- GÖVDE -->
<div class="body-wrap">
    <div class="sidebar">
        <div class="sidebar-title" id="txt-menu-title">—</div>
        <div id="menu-container">
            <p style="text-align:center;color:var(--text-muted);font-size:13px;" id="txt-loading-menu">—</p>
        </div>
    </div>

    <div class="main-container">
        <div class="center-col">
            <div class="avatar-wrap">
                <div class="avatar-frame" id="model-container">
                </div>
                <div class="voice-pill" id="voice-pill">
                    <div class="voice-pill-dot wake" id="pill-dot"></div>
                    <div class="voice-wave idle" id="pill-wave">
                        <span style="height:4px"></span><span style="height:10px"></span>
                        <span style="height:6px"></span><span style="height:14px"></span>
                        <span style="height:5px"></span>
                    </div>
                    <span class="voice-pill-text" id="pill-text">—</span>
                    <button class="voice-pill-btn" id="pill-btn" onclick="toggleVoiceSystem()">—</button>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="—" onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> <span id="txt-send">—</span>
                </button>
            </div>
            <div id="loading">—</div>
        </div>

        <div class="right-col">
            <div class="box-wrapper">
                <h3 id="txt-campaigns-title">🎁 Kampanyalar</h3>
                <div class="campaigns-box" id="campaigns-container">
                    <div class="campaign-empty">Yükleniyor...</div>
                </div>
            </div>
            <div class="chat-history" id="chat-history" style="display:none"></div>
            <div class="box-wrapper">
                <h3 id="txt-receipt-title">—</h3>
                <div class="receipt" id="receipt-container"></div>
                <div id="receipt-summary"></div>
                <button class="reset-btn" id="btn-pay" onclick="clearCart()">—</button>
            </div>
        </div>
    </div>
</div>

<!-- SİPARİŞ TAKİP MODAL -->
<div class="track-overlay" id="track-overlay">
    <div class="track-card">
        <div class="track-title">📦 Siparişiniz Takip Ediliyor</div>
        <div class="track-sub" id="track-sub">Sipariş #<span id="track-order-id">—</span></div>
        <div class="track-steps">
            <div class="track-step" id="step-pending">
                <div class="step-dot">🕐</div>
                <div><div class="step-label">Sipariş Alındı</div></div>
            </div>
            <div class="track-step" id="step-preparing">
                <div class="step-dot">☕</div>
                <div><div class="step-label">Hazırlanıyor</div></div>
            </div>
            <div class="track-step" id="step-ready">
                <div class="step-dot">✓</div>
                <div><div class="step-label">Hazır! Tezgaha Gelin</div></div>
            </div>
            <div class="track-step" id="step-completed">
                <div class="step-dot">🎉</div>
                <div><div class="step-label">Teslim Edildi</div></div>
            </div>
        </div>
        <button class="track-close-btn" onclick="closeOrderTracking()">Kapat</button>
    </div>
</div>

<!-- JS: sıra önemli! ui-strings önce yüklenmeli -->
<script src="js/ui-strings.js"></script>
<script src="js/voice.js"></script>
<script src="js/cart.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>

<!-- 3D Model (module tip; ayrı kalmalı) -->
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const container = document.getElementById('model-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(2, 2, 5);
    scene.add(directionalLight);

    let activeMuscles = []; // { mesh, index, carpan }
    let mixer = null;
    const clock = new THREE.Clock();

    const gender = localStorage.getItem('peraGender') || 'female';

    const MODEL_CONFIG = {
        female: {
            dosya:        '/static/female.glb',
            faceMeshName: 'Head_Mesh',
            modelPos:     { x: 0,   y: -0.15, z: 2.6 },
            // Avaturn modeli. Bu modelin idle'ı statik ve kafası kalçadan
            // ayrı ~+5° dönük; kafanın tam karşıya bakması için ekstra dönüş
            // gerekmiyor (rotY = 0). (Erkek modelden farklı: onun kalçası
            // ~-32° dönük olduğu için orada büyük telafi gerekiyordu.)
            modelRotY:    0.0,
            oynatAnim:    true,
            kaslar: [
                { isim: 'jawOpen',   carpan: 0.7 },
                { isim: 'mouthOpen', carpan: 0.4 },
            ],
        },
        male: {
            dosya:        '/static/eren3.glb',
            faceMeshName: 'Head_Mesh',
            modelPos:     { x: 0,   y: -0.15, z: 2.6 },
            // Avaturn idle animasyonu kalçayı ~32° (-0.555 rad) yana çeviriyor.
            // Tam telafi (0.555) dümdüz/vesikalık duruyordu; 0.503 ile çok
            // hafif açılı (~3°) bir duruş bırakıyoruz.
            modelRotY:    0.503,
            // Avaturn modelleri T-pozunda export ediliyor; doğal duruş
            // animasyonun içinde — onu oynat ki kollar düzgün dursun.
            oynatAnim:    true,

            kaslar: [
                { isim: 'jawOpen',   carpan: 0.7 },
                { isim: 'mouthOpen', carpan: 0.4 },
            ],
        },
    };

    const cfg = MODEL_CONFIG[gender] || MODEL_CONFIG.female;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    function onModelLoaded(gltf) {
            const model = gltf.scene;
            model.position.set(cfg.modelPos.x, cfg.modelPos.y, cfg.modelPos.z);
            if (cfg.modelRotY !== undefined) model.rotation.y = cfg.modelRotY;
            scene.add(model);

            // Avaturn gibi T-pozunda gelen modeller için doğal duruş
            // animasyonunu oynat.
            mixer = null;
            if (cfg.oynatAnim && gltf.animations && gltf.animations.length) {
                mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(gltf.animations[0]).play();
            }

            // Kasları topla. İki mod var:
            //  • index tabanlı kas  → yalnızca tanımlı yüz mesh'ine uygulanır
            //    (yüz birden çok primitive'e bölünmüş olabilir: _1, _2 ...).
            //  • isim tabanlı kas   → o morph'a sahip TÜM mesh'lere uygulanır,
            //    böylece çene açılınca Head_Mesh ile birlikte Teeth_Mesh ve
            //    Tongue_Mesh de oynar (alt dişler/dil sabit kalmaz).
            activeMuscles = [];
            const faceBase = cfg.faceMeshName.replace(/_\d+$/, '');
            model.traverse((child) => {
                if (!child.isMesh || !child.morphTargetInfluences) return;
                const yuzMesh = child.name.startsWith(faceBase) || child.name === cfg.faceMeshName;

                cfg.kaslar.forEach(k => {
                    if (k.index !== undefined) {
                        if (yuzMesh && k.index < child.morphTargetInfluences.length) {
                            activeMuscles.push({ mesh: child, index: k.index, carpan: k.carpan });
                        }
                    } else if (k.isim && child.morphTargetDictionary) {
                        const idx = child.morphTargetDictionary[k.isim];
                        if (idx !== undefined) {
                            activeMuscles.push({ mesh: child, index: idx, carpan: k.carpan });
                        }
                    }
                });
            });
            console.log('Lip-sync kasları:', activeMuscles.length);
    }

    // Önce login sayfasının doldurduğu Cache Storage'a bak — varsa anında parse,
    // yoksa normal indir (ve depoya koy ki bir dahaki sefere anında gelsin).
    (async () => {
        const onErr = (e) => console.error('Model yükleme hatası:', e);
        try {
            const cache = await caches.open('pera-models');
            let hit = await cache.match(cfg.dosya);
            if (!hit) {
                await cache.add(cfg.dosya);
                hit = await cache.match(cfg.dosya);
            }
            const data = await hit.arrayBuffer();
            console.log('Model Cache Storage\'dan yüklendi:', cfg.dosya);
            loader.parse(data, '/static/', onModelLoaded, onErr);
        } catch(e) {
            console.warn('Cache Storage kullanılamadı, ağdan indiriliyor:', e);
            loader.load(cfg.dosya, onModelLoaded, undefined, onErr);
        }
    })();

    function animate() {
        requestAnimationFrame(animate);

        if (mixer) mixer.update(clock.getDelta());

        if (activeMuscles.length > 0) {
            if (window.isPeraSpeaking) {
                // Gerçek ses genliği — sesle senkron lip-sync
                let aciklik = window.getPeraAudioLevel ? window.getPeraAudioLevel() : null;
                if (aciklik === null) {
                    // Analyser yoksa fallback: sinüs
                    aciklik = (Math.sin(Date.now() * 0.015) + 1) / 2;
                }
                activeMuscles.forEach(m => {
                    const hedef  = aciklik * m.carpan;
                    const mevcut = m.mesh.morphTargetInfluences[m.index];
                    // Yumuşatma: ani sıçrama yerine hedefe hızlı yaklaş
                    m.mesh.morphTargetInfluences[m.index] = mevcut + (hedef - mevcut) * 0.5;
                });
            } else {
                activeMuscles.forEach(m => {
                    const v = m.mesh.morphTargetInfluences[m.index] * 0.8;
                    m.mesh.morphTargetInfluences[m.index] = v < 0.001 ? 0 : v;
                });
            }
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        const newWidth = container.clientWidth;
        const newHeight = container.clientHeight;
        camera.aspect = newWidth / newHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(newWidth, newHeight);
    });
</script>

</body>
</html>
